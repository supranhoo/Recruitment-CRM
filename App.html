/* ---------------- BGV tracker ---------------- */
const bgvCls = s => String(s || '').replace(/\W+/g, '');
const bgvRag = r => r.rag ? `<span class="bgv-rag ${r.rag}" title="${esc(r.why || '')}">${r.rag}</span>` : '';
const bgvStChip = s => `<span class="bgv-st ${bgvCls(s)}">${esc(s)}</span>`;
const BGV_TYPE_NOTE = { 'Previous employer': 'Earlier employers · start within 3 days of the offer', 'Current employer': 'The employer being left · start within 2 days of joining' };
async function viewBgv(v) {
  const f = S.bgvF = S.bgvF || { tab: 'mine', type: '', status: '', rag: '', q: '', rec: '' };
  let B; try { B = S.bgv = await api('apiBgvList'); } catch (e) { v.innerHTML = `<div class="empty">${esc(e)}</div>`; return; }
  if (!B.lead && ['vendors', 'rules', 'reports', 'govern'].includes(f.tab)) f.tab = 'mine';
  const tabs = [['mine', `My BGV${B.mine.open ? ' · ' + B.mine.open : ''}`], ['all', `All cases${B.all.toDecide && (B.decide || B.lead) ? ' · ' + B.all.toDecide + ' to decide' : ''}`]].concat(B.lead ? [['reports', 'Reports'], ['vendors', 'Vendors'], ['rules', 'Rules'], ['govern', 'Governance']] : []);
  v.innerHTML = `<div class="page-head"><div><h1>BGV tracker</h1><p>Background verification of new hires: the previous employers (start within 3 days of the offer) and the current employer (start within 2 days of joining). The recruiter of the position owns each case; TA Leads and the Head of HR oversee them.</p></div><div class="page-actions"><button class="btn" id="bgImport">Import vendor update</button></div></div>
    <div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button role="tab" data-t="${k}" aria-selected="${f.tab === k}">${esc(l)}</button>`).join('')}</div><div id="bgBody" style="margin-top:16px"></div>`;
  $$('.tabs button', v).forEach(b => b.onclick = () => { f.tab = b.dataset.t; viewBgv(v); });
  $('#bgImport').onclick = () => openBgvImport(() => viewBgv(v));
  if (S.bgvOpenId) { const id = S.bgvOpenId; S.bgvOpenId = null; setTimeout(() => openBgvCase(id, () => viewBgv(v)), 0); }
  if (f.tab === 'reports') return bgvReports($('#bgBody'), B, v);
  if (f.tab === 'vendors') return bgvVendors($('#bgBody'), B, v);
  if (f.tab === 'rules') return bgvRulesTab($('#bgBody'), B, v);
  if (f.tab === 'govern') return bgvGovernTab($('#bgBody'), B, v);
  bgvCases($('#bgBody'), B, v);
}
function bgvCases(el, B, v) {
  const f = S.bgvF, own = f.tab === 'mine', sum = own ? B.mine : B.all;
  const scope = B.rows.filter(r => own ? r.mine : true);
  const recs = [...new Set(B.rows.map(r => r.recruiter))].sort();
  el.innerHTML = `<div class="kpis bgv-kpis">
      <div class="kpi"><div class="v">${sum.open}</div><div class="l">Open cases</div></div>
      <div class="kpi ${sum.toStart ? 'alert' : ''}"><div class="v">${sum.toStart}</div><div class="l">To start</div></div>
      <div class="kpi"><div class="v">${sum.inProgress}</div><div class="l">With the vendor</div></div>
      <div class="kpi"><div class="v">${sum.toReview}</div><div class="l">Report to review</div></div>
      ${B.decide || B.lead ? `<div class="kpi ${sum.toDecide ? 'alert' : ''}"><div class="v">${sum.toDecide || 0}</div><div class="l">Result to decide (Head of HR)</div></div>` : ''}
      <div class="kpi ${sum.red ? 'alert' : ''}"><div class="v">${sum.red}</div><div class="l">Red: past the limit</div></div>
      <div class="kpi"><div class="v">${sum.amber}</div><div class="l">Amber: close to it</div></div>
      <div class="kpi"><div class="v">${sum.closedMonth}</div><div class="l">Closed this month</div></div></div>
    <div class="filters"><div class="field"><label for="bgQ">Search</label><input id="bgQ" value="${esc(f.q)}" placeholder="Candidate, position, MRF"></div>
      <div class="field"><label for="bgType">Type</label><select id="bgType">${opts([['', 'Both'], ...B.types.map(t => [t, t])], f.type, false)}</select></div>
      <div class="field"><label for="bgSt">Status</label><select id="bgSt">${opts([['', 'All'], ['open', 'Open'], ['decision', 'Result to decide'], ...B.statuses.map(s => [s, s])], f.status, false)}</select></div>
      <div class="field"><label for="bgRag">Warning</label><select id="bgRag">${opts([['', 'Any'], ['Red', 'Red'], ['Amber', 'Amber'], ['Green', 'Green']], f.rag, false)}</select></div>
      ${own ? '' : `<div class="field"><label for="bgRec">Recruiter</label><select id="bgRec">${opts(recs, f.rec)}</select></div>`}
      <div class="field" style="justify-content:flex-end"><button class="btn sm" id="bgCsv">Download CSV</button></div></div>
    <div id="bgList"></div><p class="legend">Red means a limit has passed (start date, vendor turnaround of ${B.rules.cfg.vendorTatDays} days, or review within ${B.rules.cfg.reviewDays} days of the report); amber means 80% of it is used. Findings and files are visible to the owner, TA Leads and the Head of HR; others see the status only.</p>`;
  const rank = { Red: 0, Amber: 1, Green: 2, '': 3 };
  const draw = () => {
    const q = f.q.trim().toLowerCase();
    const rows = scope.filter(r => (!f.type || r.type === f.type) && (!f.status || (f.status === 'open' ? !['Closed', 'Cancelled'].includes(r.status) : f.status === 'decision' ? !!r.needsDecision : r.status === f.status)) && (!f.rag || r.rag === f.rag)
      && (!f.rec || r.recruiter === f.rec) && (!q || [r.candidate, r.position, r.mrf, r.id].join(' ').toLowerCase().includes(q)))
      .sort((a, b) => rank[a.rag] - rank[b.rag] || String(a.due).localeCompare(String(b.due)));
    $('#bgList').innerHTML = rows.length ? `<div class="table-wrap"><table class="bgv-table"><thead><tr><th>Candidate</th><th>Position</th><th>Type</th><th>Recruiter</th><th>Status</th><th>Start by</th><th>Started</th><th>Report needed</th></tr></thead><tbody>
      ${rows.map(r => `<tr class="${r.canWork ? 'click' : 'ro'}" data-id="${esc(r.id)}" ${r.canWork ? 'tabindex="0"' : `title="Status only: this case belongs to ${esc(r.recruiter)}"`}><td><b>${esc(r.candidate) || '<span class="sub">Candidate not linked</span>'}</b><span class="sub">${esc(r.id)}${r.legacy ? ' · carried over' : ''}</span></td>
        <td>${esc(r.position)}<span class="sub">${esc(r.mrf)} · ${esc(r.dept)} · ${esc(r.grade)}</span></td><td>${esc(r.type)}</td><td>${esc(r.recruiter)}</td>
        <td>${bgvStChip(r.status)} ${bgvRag(r)}${r.outcome && ['Closed', 'Under review', 'Report received'].includes(r.status) ? `<span class="sub">${esc(r.outcome)}${r.decision ? ' · ' + esc(r.decision) : r.needsDecision ? ' · <b class="miss">waiting for the Head of HR</b>' : ''}</span>` : ''}${r.why && r.rag !== 'Green' ? `<span class="sub">${esc(r.why)}</span>` : ''}</td>
        <td class="nw">${fmtDate(r.due)}</td><td class="nw">${r.initiated ? fmtDate(r.initiated) : '<span class="sub">—</span>'}</td><td class="nw">${r.resultDue ? fmtDate(r.resultDue) : '<span class="sub">—</span>'}</td></tr>`).join('')}</tbody></table></div>`
      : `<div class="empty">${scope.length ? 'No case matches.' : own ? 'You have no BGV cases yet. A case opens automatically when a candidate for one of your Manager-and-above (or flagged) positions reaches the Offer stage, and a second one when they join.' : 'No BGV cases yet.'}</div>`;
    $$('#bgList tr.click', el).forEach(tr => { tr.onclick = () => openBgvCase(tr.dataset.id, () => viewBgv(v)); tr.onkeydown = e => { if (e.key === 'Enter') openBgvCase(tr.dataset.id, () => viewBgv(v)); }; });
    $('#bgCsv').onclick = () => csvSave(`bgv-cases-${today()}.csv`, ['Case', 'Type', 'Candidate', 'Position', 'MRF', 'Department', 'Grade', 'Recruiter', 'Status', 'Warning', 'Why', 'Start by', 'Started', 'Report needed', 'Outcome', 'Decision'],
      rows.map(r => [r.id, r.type, r.candidate, r.position, r.mrf, r.dept, r.grade, r.recruiter, r.status, r.rag, r.why, r.due, r.initiated, r.resultDue, r.outcome || '', r.decision || '']));
  };
  $('#bgQ').oninput = debounce(e => { f.q = e.target.value; draw(); }, 150);
  $('#bgType').onchange = e => { f.type = e.target.value; draw(); };
  $('#bgSt').onchange = e => { f.status = e.target.value; draw(); };
  $('#bgRag').onchange = e => { f.rag = e.target.value; draw(); };
  if ($('#bgRec')) $('#bgRec').onchange = e => { f.rec = e.target.value; draw(); };
  draw();
}

/* ---- One case ---- */
async function openBgvCase(id, after) {
  const body = openDrawer('BGV case ' + id, '<p class="muted">Loading…</p>', 'bgv-drawer');
  let X; try { X = await api('apiBgvCase', id); } catch (e) { body.innerHTML = `<p class="miss">${esc(e)}</p>`; return; }
  const draw = X => {
    S.bgvLast = X; const c = X.c, vend = Object.fromEntries(X.vendors.map(v => [v.id, v.name])), closed = ['Closed', 'Cancelled'].includes(c.status);
    const fileField = (k, l) => ({ k, l, t: 'file', ro: closed && !X.lead });
    const dt = (l, v, sub) => `<div><span class="sub">${l}</span><b>${v ? fmtDate(v) : '—'}</b>${sub ? `<span class="sub">${sub}</span>` : ''}</div>`;
    body.innerHTML = `<div class="bgv-head"><div><h3 style="margin:0">${c.candidate ? esc(c.candidate) : 'Candidate not linked'}</h3><div class="sub">${esc(c.position)} · ${esc(c.mrf)} · ${esc(c.dept)} · ${esc(c.grade)} · recruiter ${esc(c.recruiter)}</div>
        <div class="sub"><b>${esc(c.type)}</b> — ${esc(BGV_TYPE_NOTE[c.type] || '')}</div></div><div>${bgvStChip(c.status)} ${bgvRag(c)}</div></div>
      ${c.why && c.rag !== 'Green' && c.rag ? `<div class="note ${c.rag === 'Red' ? 'warn-note' : ''}">${esc(c.why)}</div>` : ''}${c.purged ? `<div class="note">Purged under the retention rule on ${fmtDate(c.purged)}: the files and personal details were deleted. The dates, status and result stay for the reports.</div>` : ''}${c.legacy ? '<div class="note">Carried over from the position’s BGV fields. Check the status and add the checks.</div>' : ''}
      <div class="bgv-dates">${dt(c.type === 'Previous employer' ? 'Offer' : 'Joined', c.trigger)}${dt('Start by', c.due)}${c.type === 'Previous employer' ? dt('Report needed by', c.resultDue) : ''}${dt('Consent', c.consent)}${dt('Started', c.initiated, c.vendor ? esc(vend[c.vendor] || (c.vendor === 'DIRECT' ? 'Direct' : c.vendor)) + (c.vendorRef ? ' · ' + esc(c.vendorRef) : '') : '')}${dt('Report received', c.report)}</div>
      ${c.candId ? `<p style="margin:8px 0"><button class="linklike" id="bcCand">Open candidate</button> · <button class="linklike" id="bcPos">Open position</button></p>` : ''}
      ${!closed ? `<fieldset class="bgv-move"><legend>Next step</legend>
        <div class="grid"><div class="field"><label for="bmTo">Move to</label><select id="bmTo">${opts(c.next.map(n => [n, n]), '', true)}</select></div><div class="field" id="bmDate" hidden><label for="bmOn" id="bmOnL">Date</label><input id="bmOn" type="date" value="${today()}" max="${today()}"></div>
          <div class="field" id="bmConsentF" hidden><label for="bmConsent">Consent given on</label><input id="bmConsent" type="date" value="${esc(c.consent || '')}" max="${today()}"><span class="hint">The signed consent file is attached below.</span></div>
          <div class="field" id="bmVendorF" hidden><label for="bmVendor">Vendor</label><select id="bmVendor">${opts([['DIRECT', 'Direct (no vendor)']].concat(X.vendors.filter(v => v.active).map(v => [v.id, v.name])), c.vendor, true)}</select></div>
          <div class="field" id="bmRefF" hidden><label for="bmRef">Vendor reference</label><input id="bmRef" value="${esc(c.vendorRef || '')}" maxlength="80"></div>
          <div class="field wide"><label for="bmNote">Note ${'<span class="opt">(needed to cancel)</span>'}</label><input id="bmNote" maxlength="400"></div></div>
        <div class="drawer-actions" style="position:static"><button class="btn primary" id="bmGo" disabled>Move</button></div></fieldset>` : (c.status === 'Closed' && X.lead ? `<div class="drawer-actions" style="position:static"><button class="btn" id="bmReopen">Reopen for review</button></div>` : '')}
      <h4>Checks</h4>
      <div class="table-wrap"><table class="bgv-checks"><thead><tr><th>Check</th><th>About (employer, institute, address)</th><th>Period</th><th>Status</th><th>Finding</th><th></th></tr></thead><tbody>
        ${X.checks.map(k => `<tr data-ck="${esc(k.id)}"><td><b>${esc(k.type)}</b></td><td><input class="ck-subject" value="${esc(k.subject)}" ${closed ? 'disabled' : ''}></td><td><input class="ck-period" value="${esc(k.period)}" ${closed ? 'disabled' : ''}></td>
          <td><select class="ck-status" ${closed ? 'disabled' : ''}>${opts(X.checkStatuses, k.status, false)}</select></td><td><input class="ck-finding" value="${esc(k.finding)}" ${closed ? 'disabled' : ''}></td><td>${closed ? '' : '<button class="btn sm ck-save">Save</button>'}</td></tr>`).join('')}</tbody></table></div>
      ${closed ? '' : `<div class="rs-row"><select id="bkType" aria-label="Add a check">${opts(X.optionalChecks.concat(X.rules.defaultChecks).filter((t, i, a) => a.indexOf(t) === i).map(t => [t, t]), '', true)}</select><input id="bkSubject" placeholder="About (employer, institute, address)" style="flex:1;min-width:200px"><button class="btn sm" id="bkAdd">Add check</button></div>`}
      <h4>Result</h4>
      <div class="grid"><div class="field"><label for="boOutcome">Outcome</label><select id="boOutcome" ${closed && !X.lead ? 'disabled' : ''}>${opts(X.outcomes, c.outcome, true)}</select></div>
        <div class="field"><label>Decision (Head of HR)</label><div class="bgv-dec">${c.decision ? `<b>${esc(c.decision)}</b><span class="sub">${esc(String(c.decisionBy).split('@')[0])} · ${fmtDate(c.decisionOn)}${c.decisionNote ? ' · ' + esc(c.decisionNote) : ''}</span>` : ['Minor discrepancy', 'Major discrepancy', 'Unable to verify'].includes(c.outcome) ? '<span class="miss">Waiting for the Head of HR</span>' : '<span class="sub">Not needed for a clear result</span>'}</div></div></div>
      ${X.decide && ['Report received', 'Under review'].includes(c.status) && ['Minor discrepancy', 'Major discrepancy', 'Unable to verify'].includes(c.outcome) ? `<fieldset class="bgv-move"><legend>Your decision</legend><div class="grid"><div class="field"><label for="bdDec">Decision</label><select id="bdDec">${opts(X.decisions, c.decision, true)}</select></div><div class="field wide"><label for="bdNote">Reason</label><input id="bdNote" maxlength="500" value="${esc(c.decisionNote || '')}"></div></div>
        <div class="drawer-actions" style="position:static"><button class="btn primary" id="bdSave">Record decision</button></div></fieldset>` : ''}
      <div class="field wide" style="margin-top:10px"><label for="boRemarks">Remarks</label><textarea id="boRemarks" rows="2" maxlength="1000" ${closed && !X.lead ? 'disabled' : ''}>${esc(c.remarks)}</textarea></div>
      <div class="drawer-actions" style="position:static;margin-top:0"><button class="btn" id="boSave">Save outcome and remarks</button></div>
      ${c.purged ? '' : `<h4>Documents</h4>`}<div id="bgDocs" ${c.purged ? 'hidden' : ''}>${wrapForm(form([fileField('Consent_File', 'Candidate consent (signed)'), fileField('Report_File', 'Vendor / employer report'), fileField('Initiation_Proof_File', 'Proof that the verification was started')], { Consent_File: c.consentFile, Report_File: c.reportFile, Initiation_Proof_File: c.proofFile }))}</div>
      <div class="drawer-actions" style="position:static;margin-top:0" ${c.purged ? 'hidden' : ''}><button class="btn" id="bdUp">Upload chosen files</button></div>
      <h4>Timeline</h4>
      ${(X.templates || []).length ? `<div class="rs-row"><select id="bmTpl" aria-label="Email template">${opts(X.templates.map(t => [t.id, t.label]), '', true)}</select><button class="btn sm" id="bmMail" disabled>Email\u2026</button><span class="hint">Fills the wording in; you send it from your own email.</span></div>` : ''}
      <div class="rs-row"><select id="blKind" aria-label="Kind of entry">${opts(X.logKinds, 'Note', false)}</select><input id="blNote" placeholder="What happened, who was spoken to, when to chase next" style="flex:1;min-width:220px" maxlength="500"><button class="btn sm" id="blAdd">Add</button></div>
      <ol class="hist bgv-log">${X.log.map(l => `<li><b>${esc(l.kind)}</b>${l.to ? ` · ${l.from ? esc(l.from) + ' → ' : ''}${esc(l.to)}` : ''} <span class="sub">${esc(l.at)} · ${esc(String(l.by).split('@')[0])}</span>${l.note ? `<div>${esc(l.note)}</div>` : ''}</li>`).join('')}</ol>`;
    wire(X);
  };
  const run = async (fn, ok) => { try { const r = await fn(); S.bgv = null; draw(r); if (ok) toast(ok); if (after) after(); } catch (e) { toast(e, true); } };
  const wire = X => {
    const c = X.c;
    if ($('#bcCand')) { $('#bcCand').onclick = () => openCandidate(c.candId); $('#bcPos').onclick = async () => { try { await loadPositions(); const l = lineById(c.line); if (l) positionDrawer(l); } catch (e) { toast(e, true); } }; }
    const to = $('#bmTo'); if (to) {
      const upd = () => {
        const t = to.value; $('#bmGo').disabled = !t;
        $('#bmDate').hidden = !['Initiated', 'Report received'].includes(t); $('#bmOnL').textContent = t === 'Initiated' ? 'Started on' : 'Report received on';
        $('#bmConsentF').hidden = t !== 'Initiated'; $('#bmVendorF').hidden = t !== 'Initiated'; $('#bmRefF').hidden = t !== 'Initiated';
      };
      to.onchange = upd; upd();
      $('#bmGo').onclick = () => run(() => api('apiBgvStatus', c.id, to.value, { on: $('#bmOn').value, consentOn: $('#bmConsent').value, vendor: $('#bmVendor').value, vendorRef: $('#bmRef').value, note: $('#bmNote').value, outcome: $('#boOutcome').value }), 'Moved.');
    }
    if ($('#bmReopen')) $('#bmReopen').onclick = () => run(() => api('apiBgvStatus', c.id, 'Under review', { note: 'Reopened' }), 'Reopened.');
    $$('tr[data-ck]', body).forEach(tr => { const b = $('.ck-save', tr); if (b) b.onclick = () => run(() => api('apiBgvCheckSave', c.id, { id: tr.dataset.ck, subject: $('.ck-subject', tr).value, period: $('.ck-period', tr).value, status: $('.ck-status', tr).value, finding: $('.ck-finding', tr).value }), 'Check saved.'); });
    if ($('#bkAdd')) $('#bkAdd').onclick = () => { if (!$('#bkType').value) return toast('Choose the check to add.', true); run(() => api('apiBgvCheckSave', c.id, { type: $('#bkType').value, subject: $('#bkSubject').value }), 'Check added.'); };
    $('#boSave').onclick = () => run(() => api('apiBgvSave', c.id, { outcome: $('#boOutcome').value, remarks: $('#boRemarks').value }), 'Saved.');
    if ($('#bdSave')) $('#bdSave').onclick = () => run(() => api('apiBgvDecide', c.id, { decision: $('#bdDec').value, note: $('#bdNote').value }), 'Decision recorded.');
    if ($('#bmTpl')) { $('#bmTpl').onchange = () => { $('#bmMail').disabled = !$('#bmTpl').value; }; $('#bmMail').onclick = () => { const t = X.templates.find(x => x.id === $('#bmTpl').value); if (t) bgvEmailDialog(X, t, async () => { try { draw(await api('apiBgvCase', c.id)); } catch (e) { } }); }; }
    $('#blAdd').onclick = () => run(() => api('apiBgvNote', c.id, $('#blKind').value, $('#blNote').value), 'Added.');
    bindAttachmentViews('BGV', c.id, body);
    $('#bdUp').onclick = async e => {
      busy(e.target, true, 'Uploading…');
      try { const bad = checkAttachments($('#bgDocs')); if (bad) throw bad; await uploadAttachments('BGV', c.id, $('#bgDocs')); draw(await api('apiBgvCase', c.id)); toast('Files uploaded.'); }
      catch (err) { toast(err, true); busy(e.target, false, 'Upload chosen files'); }
    };
  };
  draw(X);
}

/** Status lines for a candidate's card, a profile or a position (everyone sees the status). */
async function bgvChips(el, o) {
  if (!el) return;
  let rows; try { rows = await api('apiBgvFor', o.kind, o.id); } catch (e) { return; }
  if (!el.isConnected) return;
  if (!rows.length) { el.innerHTML = ''; return; }
  el.innerHTML = `<section class="app-sec bgv-sec"><h3>Background verification</h3><ul class="bgv-chips">${rows.map(r => `<li><b>${esc(r.type)}</b> ${bgvStChip(r.status)} ${bgvRag(r)}
    <span class="sub">${['Not started', 'Awaiting consent'].includes(r.status) && r.due ? 'start by ' + fmtDate(r.due) : esc(r.recruiter)}${r.canWork && r.outcome ? ' · ' + esc(r.outcome) : ''}</span>${r.canWork ? ` <button class="linklike" data-bgv="${esc(r.id)}">Open</button>` : ''}</li>`).join('')}</ul></section>`;
  $$('[data-bgv]', el).forEach(b => b.onclick = () => { S.bgvOpenId = b.dataset.bgv; S.bgvF = S.bgvF || {}; S.bgvF.tab = 'mine'; closeDrawer(); try { $$('dialog[open]').forEach(x => x.close()); } catch (e) { } go('bgv', true); });
}

/* ---- Reports (leads) ---- */
async function bgvReports(el, B, v) {
  const f = S.bgvRep = S.bgvRep || { from: daysAgo(180), to: today() };
  el.innerHTML = `<div class="filters"><div class="field"><label for="rpFrom">Cases opened from</label><input id="rpFrom" type="date" value="${f.from}" max="${today()}"></div><div class="field"><label for="rpTo">to</label><input id="rpTo" type="date" value="${f.to}" max="${today()}"></div></div><div id="rpBody">${skRows(6, 6)}</div>`;
  const load = async () => {
    let R; try { R = await api('apiBgvReports', { from: f.from, to: f.to }); } catch (e) { if ($('#rpBody')) $('#rpBody').innerHTML = `<div class="empty">${esc(e)}</div>`; return; }
    if (!$('#rpBody')) return;
    const n = x => x == null ? '—' : x, pc = x => x == null ? '—' : x + '%', dd = x => x == null ? '—' : x + ' d';
    const row = x => `<td class="num">${x.cases}</td><td class="num">${pc(x.pctOnTime)}</td><td class="num">${n(x.late)}</td><td class="num">${n(x.overdue)}</td><td class="num">${dd(x.avgStart)}</td><td class="num">${dd(x.avgVerify)}</td><td class="num">${pc(x.pctWithinVendor)}</td><td class="num">${dd(x.avgReview)}</td><td class="num">${pc(x.pctResultOk)}</td><td class="num">${x.open}</td><td class="num">${x.red ? `<b class="miss">${x.red}</b>` : 0}</td><td class="num">${x.discrepancies}</td>`;
    const head = k => `<thead><tr><th>${k}</th><th class="num">Cases</th><th class="num">Started on time</th><th class="num">Late</th><th class="num">Overdue, not started</th><th class="num">Days to start</th><th class="num">Vendor days</th><th class="num">Within ${R.cfg.vendorTatDays} d</th><th class="num">Review days</th><th class="num">Report before joining</th><th class="num">Open</th><th class="num">Red</th><th class="num">Discrepancies</th></tr></thead>`;
    const tbl = (k, list) => list.length ? `<div class="table-wrap"><table class="bgv-table">${head(k)}<tbody>${list.map(x => `<tr><td><b>${esc(x.key)}</b></td>${row(x)}</tr>`).join('')}<tr class="tot"><td><b>All</b></td>${row(R.total)}</tr></tbody></table></div>` : '<div class="empty">No cases opened in this period.</div>';
    $('#rpBody').innerHTML = `<p class="hint">Started on time = started by the start-by date (3 days after the offer for previous employers; 2 days after joining for the current employer). Vendor days run from the start to the report; review days from the report to closing. Cases opened ${fmtDate(R.from)} to ${fmtDate(R.to)}.</p>
      <section class="panel"><div class="dp-h"><h2>Team scorecard by recruiter</h2><button class="btn sm" id="rpCsv1">Download CSV</button></div>${tbl('Recruiter', R.byRecruiter)}</section>
      <section class="panel" style="margin-top:16px"><div class="dp-h"><h2>By type</h2></div>${tbl('Type', R.byType)}</section>
      <section class="panel" style="margin-top:16px"><div class="dp-h"><h2>By month the case opened</h2></div>${tbl('Month', R.byMonth)}</section>

/* ---- Vendor spreadsheet import ---- */
/** Splits pasted or uploaded text into rows of cells (tab, semicolon or comma separated; quoted cells allowed). */
function bgvSplitText(text) {
  const t = String(text || '').replace(/\r\n?/g, '\n').replace(/^﻿/, '');
  const first = t.split('\n').find(l => l.trim()) || '';
  const delim = first.includes('\t') ? '\t' : (first.split(';').length > first.split(',').length ? ';' : ',');
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const ch = t[i];
    if (q) { if (ch === '"') { if (t[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"' && !cell) q = true;
    else if (ch === delim) { row.push(cell); cell = ''; }
    else if (ch === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.map(r => r.map(c => String(c).trim())).filter(r => r.some(c => c));
}
const BGV_COLS = [['ref', 'Case number or vendor reference', /case|ref|request|bgv\s*id|file\s*(no|number)|application\s*(no|id)/i], ['check', 'Check', /check|component|verification|module|type of/i],
  ['status', 'Status', /status|result|outcome|verdict/i], ['finding', 'Remarks / finding', /remark|finding|comment|detail|observation|note/i], ['date', 'Date (done on)', /date|completed|closed|verified\s*on|report/i]];
/** Which column holds what, from the header names. Returns { ref: 0, check: 2, ... } (-1 when not found). */
function bgvGuessCols(header) {
  const used = new Set(), out = {};
  BGV_COLS.forEach(([k, , re]) => { const i = header.findIndex((h, j) => !used.has(j) && re.test(h)); out[k] = i; if (i >= 0) used.add(i); });
  return out;
}
async function bgvReadFile(file) {
  if (/\.xlsx?$/i.test(file.name)) {
    await loadScript(CDN_NPM + 'xlsx@0.18.5/dist/xlsx.full.min.js');
    const wb = window.XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: true });
    const ws = wb.Sheets[wb.SheetNames[0]];
    return window.XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, dateNF: 'yyyy-mm-dd', defval: '' }).map(r => r.map(c => String(c).trim())).filter(r => r.some(c => c));
  }
  return bgvSplitText(await file.text());
}
function openBgvImport(after) {
  const st = { rows: [], header: [], map: {}, result: null };
  const body = openDrawer('Import a vendor update', `<p class="hint" style="margin-top:0">Update many cases at once from the vendor’s status sheet. Each row names a case (our case number, e.g. BGV-00012, or the vendor’s own reference), the check, its status and, for a discrepancy or an unverified result, the vendor’s remark. Nothing is saved until you check the file and apply it.</p>
    <div class="field wide"><label for="biFile">Spreadsheet or CSV file</label><input id="biFile" type="file" accept=".xlsx,.xls,.csv,.tsv,.txt"></div>
    <div class="field wide"><label for="biPaste">…or paste the rows (copy the cells from Excel, with the heading row)</label><textarea id="biPaste" rows="5" placeholder="Reference\tCheck\tStatus\tRemarks\tDate"></textarea></div>
    <div class="drawer-actions" style="position:static"><button class="btn" id="biRead">Read the file</button></div>
    <div id="biMap"></div><div id="biOut"></div>`, 'bgv-drawer');
  const readRows = rows => {
    if (!rows.length) { toast('The file has no rows.', true); return; }
    const hdr = rows[0], looksHeader = hdr.filter(c => /[A-Za-z]{3,}/.test(c)).length >= 2;
    st.header = looksHeader ? hdr : hdr.map((_, i) => 'Column ' + (i + 1)); st.rows = looksHeader ? rows.slice(1) : rows; st.map = bgvGuessCols(st.header); st.result = null;
    drawMap();
  };
  const drawMap = () => {
    $('#biOut', body).innerHTML = '';
    $('#biMap', body).innerHTML = `<h4>${st.rows.length} row${st.rows.length === 1 ? '' : 's'} read. Which column is which?</h4>
      <div class="grid">${BGV_COLS.map(([k, l]) => `<div class="field"><label for="bm_${k}">${l}${k === 'finding' || k === 'date' ? ' (optional)' : ''}</label><select id="bm_${k}" data-k="${k}">${opts(st.header.map((h, i) => [String(i), h || ('Column ' + (i + 1))]), st.map[k] >= 0 ? String(st.map[k]) : '', true)}</select></div>`).join('')}</div>
      <label class="chk"><input type="checkbox" id="biAdv" checked> Move a case to “Report received” when every check is back, or to “Insufficiency” when the vendor waits for the candidate</label>
      <div class="drawer-actions" style="position:static"><button class="btn primary" id="biCheck">Check the file</button></div>`;
    $$('select[data-k]', body).forEach(s => s.onchange = () => { st.map[s.dataset.k] = s.value === '' ? -1 : Number(s.value); });
    $('#biCheck', body).onclick = () => run(false);
  };
  const payload = () => st.rows.map(r => { const g = k => st.map[k] >= 0 ? (r[st.map[k]] == null ? '' : r[st.map[k]]) : ''; return { ref: g('ref'), check: g('check'), status: g('status'), finding: g('finding'), date: g('date') }; });
  const run = async apply => {
    if (st.map.ref < 0 || st.map.check < 0 || st.map.status < 0) return toast('Choose the case reference, check and status columns.', true);
    const b = $(apply ? '#biApply' : '#biCheck', body); busy(b, true, apply ? 'Applying…' : 'Checking…');
    try {
      const R = await api('apiBgvImport', payload(), { apply, advance: $('#biAdv', body).checked, skipErrors: apply && !!$('#biSkip', body) && $('#biSkip', body).checked });
      st.result = R; if (apply) { toast(`Applied: ${R.counts.ok} row${R.counts.ok === 1 ? '' : 's'} on ${R.counts.cases} case${R.counts.cases === 1 ? '' : 's'}.`); if (after) after(); }
      drawResult(R); busy(b, false, apply ? 'Apply' : 'Check the file');
    } catch (e) { toast(e, true); busy(b, false, apply ? 'Apply' : 'Check the file'); }
  };
  const drawResult = R => {
    const bad = R.counts.errors, ok = R.counts.ok;
    $('#biOut', body).innerHTML = `<h4>${R.applied ? 'Applied' : 'Check result'}</h4>
      <div class="ctc-status ${bad ? (ok ? 'warn' : 'bad') : 'ok'}">${R.applied ? '✔ Done. ' : ''}${ok} row${ok === 1 ? '' : 's'} fine on ${R.counts.cases} case${R.counts.cases === 1 ? '' : 's'}${bad ? `, <b>${bad} with a problem</b>` : ''}.</div>
      ${R.cases.length ? `<ul class="bgv-imp-cases">${R.cases.map(c => `<li><b>${esc(c.id)}</b> ${esc(c.candidate)} · ${esc(c.type)}: ${c.checks} check${c.checks === 1 ? '' : 's'} updated · ${c.from === c.to ? esc(c.from) : `${esc(c.from)} → <b>${esc(c.to)}</b>`}${c.stillOpen ? ` · ${c.stillOpen} check${c.stillOpen === 1 ? '' : 's'} still open` : ''}</li>`).join('')}</ul>` : ''}
      <div class="table-wrap"><table class="bgv-table"><thead><tr><th>Row</th><th>Case</th><th>Check</th><th>Status</th><th>Date</th><th>Result</th></tr></thead><tbody>
        ${R.rows.map(r => `<tr class="${r.error ? 'bad' : ''}"><td>${r.row}</td><td>${esc(r.caseId || r.ref)}<span class="sub">${esc(r.candidate)}</span></td><td>${esc(r.check)}</td><td>${esc(r.status)}</td><td class="nw">${r.date ? fmtDate(r.date) : ''}</td><td>${r.error ? `<span class="miss">${esc(r.error)}</span>` : esc(r.warn || r.action)}</td></tr>`).join('')}</tbody></table></div>
      <div class="drawer-actions" style="position:static">${R.applied ? '' : `${bad && ok ? '<label class="chk"><input type="checkbox" id="biSkip"> Apply the rows that are fine and leave the others</label>' : ''}<button class="btn primary" id="biApply" ${ok && !bad ? '' : (ok ? '' : 'disabled')}>Apply${ok ? ` ${ok} row${ok === 1 ? '' : 's'}` : ''}</button>`}<button class="btn" id="biCsv">Download this result</button></div>`;
    if ($('#biApply', body)) $('#biApply', body).onclick = () => { if (bad && !$('#biSkip', body).checked) return toast('Fix the problems in the file, or tick “Apply the rows that are fine”.', true); run(true); };
    $('#biCsv', body).onclick = () => csvSave(`bgv-import-${today()}.csv`, ['Row', 'Case', 'Candidate', 'Check', 'Status', 'Date', 'Result'], R.rows.map(r => [r.row, r.caseId || r.ref, r.candidate, r.check, r.status, r.date, r.error || r.warn || r.action]));
  };
  $('#biRead', body).onclick = async () => {
    const f = $('#biFile', body).files[0], pasted = $('#biPaste', body).value;
    try { readRows(f ? await bgvReadFile(f) : bgvSplitText(pasted)); } catch (e) { toast(String(e && e.message || e), true); }
  };
}

/* ---- Emails (prepared in the recruiter's own email app; nothing is sent from the CRM) ---- */
function bgvMailFill(text, X, to) {
  const c = X.c, vend = X.vendors.find(v => v.id === c.vendor) || {}, days = c.initiated ? Math.max(0, Math.round((Date.parse(today()) - Date.parse(c.initiated)) / 86400000)) : '';
  const checks = X.checks.filter(k => k.status !== 'Not applicable').map(k => `- ${k.type}${k.subject ? ' (' + k.subject + ')' : ''}${['Pending', 'In progress'].includes(k.status) ? '' : ': ' + k.status.toLowerCase()}`).join('\n') || '- (no checks added yet)';
  const v = { candidate: c.candidate || 'the candidate', position: c.position, mrf: c.mrf, dept: c.dept, company: X.rules.company || 'BFCL', type: c.type.toLowerCase(), case: c.id, start_by: c.due ? fmtDate(c.due) : '', started: c.initiated ? fmtDate(c.initiated) : 'not yet',
    days: String(days), vendor: vend.name || (c.vendor === 'DIRECT' ? 'verification' : 'vendor'), vendor_ref: c.vendorRef || '(awaited)', vendor_tat: String(X.rules.vendorTatDays), checks, recruiter: c.recruiter };
  return String(text).replace(/\{\{\s*([a-z_]+)\s*\}\}/g, (m, k) => k in v ? v[k] : m);
}

  if ($('#ccStipend')) $('#ccStipend').oninput = e => { f.amounts.stipend = e.target.value.replace(/[^\d]/g, ''); run(); };
  $$('select[data-flag]', el).forEach(x => x.onchange = () => { f.codes[x.dataset.flag] = x.value; run(); });
  $('#ccReset').onclick = () => { S.ctcIn = null; S.ctcCfgSeen = null; ctcCalc(el, R, v); };
  if ($('#ccRerunX')) $('#ccRerunX').onclick = () => { f.rerunOf = null; ctcCalc(el, R, v); };

/**
 * Hike comparison: the candidate's current pay against this offer and against what they asked for, like for like
 * (CTC to CTC, Gross to Gross, Net to Net) and every other combination. Amounts in the period the figures were given in.
 */
function ctcHikeHtml(H, r, ask, per) {
  const m = x => Number(String(x || '').replace(/[^\d]/g, '')) / per;
  const cur = { totalCtc: m(H.ctc), gross: m(H.gross), net: m(H.net) };
  const hasCur = cur.totalCtc > 0 || cur.gross > 0 || cur.net > 0;
  if (!hasCur && !ask) return '';
  const P = x => inr(x * per), unit = per === 12 ? 'a year' : 'a month';
  const rows = [['Total CTC', 'totalCtc'], ['Gross CTC', 'grossCtc'], ['Gross salary', 'gross'], ['Net in-hand', 'net']];
  const askKey = { total_ctc: 'totalCtc', gross: 'gross', net: 'net' }[H.askBasis];
  const hk = (a, b) => { const p = ctcPct(a, b); return p === null ? '<span class="sub">\u2014</span>' : `<b class="${p < 0 ? 'miss' : 'up'}">${ctcPctTxt(p)}</b><span class="sub">${b - a >= 0 ? '+' : '\u2212'}${P(Math.abs(b - a)).slice(1)}</span>`; };
  const amt = (a, b) => { const p = ctcPct(a, b); return `${P(b)}${p === null ? '' : `<span class="sub"><b class="${p < 0 ? 'miss' : 'up'}">${ctcPctTxt(p)}</b> hike</span>`}`; };
  const vs = (a, b) => { const d = a - b; return d === 0 ? '<span class="sub">same</span>' : `<b class="${d < 0 ? 'miss' : 'up'}">${d > 0 ? '+' : '\u2212'}${P(Math.abs(d)).slice(1)}</b><span class="sub">${ctcPctTxt(ctcPct(b, a))} vs ask</span>`; };
  const lines = [];
  if (ask && cur[askKey] > 0) lines.push(`The candidate asked for <b>${P(m(H.ask))}</b> ${askKey === 'totalCtc' ? 'CTC' : askKey === 'gross' ? 'Gross' : 'Net in-hand'}: <b>${ctcPctTxt(ctcPct(cur[askKey], m(H.ask)))}</b> on the current ${askKey === 'totalCtc' ? 'CTC' : askKey === 'gross' ? 'Gross' : 'Net'}.`);
  const like = [['CTC', 'totalCtc'], ['Gross', 'gross'], ['Net in-hand', 'net']].filter(x => cur[x[1]] > 0).map(x => `${x[0]} ${ctcPctTxt(ctcPct(cur[x[1]], r.totals[x[1]]))}`);
  if (like.length) lines.push(`This offer: ${like.join(' \u00b7 ')}.`);
  if (ask) { const d = r.totals[askKey] - ask.totals[askKey]; lines.push(d === 0 ? 'The offer meets the ask exactly.' : `The offer is <b>${P(Math.abs(d))} ${d < 0 ? 'below' : 'above'}</b> the ask on ${askKey === 'totalCtc' ? 'CTC' : askKey === 'gross' ? 'Gross' : 'Net'}.`); }
  const curKeys = [['Current CTC', 'totalCtc'], ['Current Gross', 'gross'], ['Current Net', 'net']].filter(x => cur[x[1]] > 0);
  return `<section class="panel ctc-hike"><div class="dp-h"><h2>Hike comparison</h2><span class="hint">Amounts ${unit}</span>${ask ? '<button class="btn sm" id="ccUseAsk">Use the ask as the target</button>' : ''}</div>
    ${lines.length ? `<p class="ctc-hike-sum">${lines.join(' ')}</p>` : ''}
    <div class="table-wrap"><table class="ctc-table ctc-hk"><thead><tr><th></th><th class="num">Current</th><th class="num">This offer</th>${ask ? '<th class="num">At the ask</th><th class="num">Offer vs ask</th>' : ''}</tr></thead><tbody>
      ${rows.map(([l, k]) => `<tr class="${k === askKey && ask ? 'asked' : ''}"><td>${l}${k === askKey && ask ? ' <span class="badge">asked</span>' : ''}</td><td class="num">${cur[k] > 0 ? P(cur[k]) : '<span class="sub">\u2014</span>'}</td>
        <td class="num">${amt(cur[k], r.totals[k])}</td>
        ${ask ? `<td class="num">${amt(cur[k], ask.totals[k])}</td><td class="num">${vs(r.totals[k], ask.totals[k])}</td>` : ''}</tr>`).join('')}
    </tbody></table></div>
    ${curKeys.length ? `<details class="ctc-cross"><summary>Every combination (current pay against each figure of the offer${ask ? ' and of the ask' : ''})</summary>
      ${[['This offer', r]].concat(ask ? [['At the candidate\u2019s ask', ask]] : []).map(([t, x]) => `<div class="table-wrap" style="margin-bottom:10px"><table class="ctc-table ctc-hk"><thead><tr><th>${t}</th>${rows.map(([l]) => `<th class="num">${l}<span class="sub">${P(x.totals[rows.find(y => y[0] === l)[1]])}</span></th>`).join('')}</tr></thead><tbody>
      ${curKeys.map(([cl, ck]) => `<tr><td>${cl} ${P(cur[ck])}</td>${rows.map(([, k]) => `<td class="num${k === ck ? ' like' : ''}">${hk(cur[ck], x.totals[k])}</td>`).join('')}</tr>`).join('')}
      </tbody></table></div>`).join('')}<p class="hint">Shaded cells compare like with like. The others show, for example, how the offered Gross compares with the current CTC.</p></details>` : ''}
    ${!hasCur ? '<p class="hint">Enter the candidate\u2019s current pay to see the hike %.</p>' : ''}</section>`;
}
/** What changed between an earlier calculation and the current one, line by line. */
function ctcDiffHtml(a, b, secs) {
  const map = x => Object.fromEntries(x.lines.map(l => [l.section + ':' + l.id, l]));
  const A = map(a), B = map(b), keys = [...new Set(Object.keys(A).concat(Object.keys(B)))];
  const rows = keys.map(k => ({ l: B[k] || A[k], a: A[k] ? A[k].monthly : 0, b: B[k] ? B[k].monthly : 0 })).filter(x => x.a !== x.b);
  const tot = [['Gross salary', 'gross'], ['Net in-hand', 'net'], ['Gross CTC', 'grossCtc'], ['Total CTC', 'totalCtc']].map(([l, k]) => ({ label: l, a: a.totals[k], b: b.totals[k] }));
  const d = (x, y) => { const n = y - x; return n ? `<b class="${n < 0 ? 'miss' : 'up'}">${n > 0 ? '+' : '−'}${inr(Math.abs(n)).slice(1)}</b>` : '<span class="sub">no change</span>'; };
  return `<section class="panel" style="margin-top:18px"><div class="dp-h"><h2>Changes against the earlier calculation</h2><span class="hint">Monthly amounts</span></div>
    <div class="table-wrap"><table class="ctc-table"><thead><tr><th>Item</th><th class="num">Before</th><th class="num">Now</th><th class="num">Change</th></tr></thead><tbody>
      ${rows.length ? rows.map(x => `<tr><td>${esc(x.l.label)}<span class="sub"> · ${esc(secs[x.l.section] || '')}</span></td><td class="num">${inr(x.a)}</td><td class="num">${inr(x.b)}</td><td class="num">${d(x.a, x.b)}</td></tr>`).join('') : '<tr class="nil"><td colspan="4">No component changed.</td></tr>'}
      ${tot.map(x => `<tr class="tot"><td>${x.label}</td><td class="num">${inr(x.a)}</td><td class="num">${inr(x.b)}</td><td class="num">${d(x.a, x.b)}</td></tr>`).join('')}
    </tbody></table></div></section>`;
}

/* ---- Link to a candidate or position ---- */
/** "6.5 LPA", "12 lakh", "85000 pm" -> { amount, per }; anything unclear (a bare number) is left for the recruiter to enter. */
function ctcParseMoney(text) {
  const t = String(text || '').trim(); if (!t) return null;
  const m = t.replace(/,/g, '').match(/\d+(\.\d+)?/); if (!m) return null;
  const n = parseFloat(m[0]); if (!(n > 0)) return null;
  if (/(\d)\s*(lpa|lakhs?|lacs?|l)\b/i.test(t.replace(/,/g, ''))) return { amount: Math.round(n * 1e5), per: 'year' };
  if (/\b(pm|p\.m\.?|per month|monthly|\/m|\/month)\b/i.test(t)) return { amount: Math.round(n), per: 'month' };
  if (/\b(pa|p\.a\.?|per annum|yearly|annual|\/year)\b/i.test(t)) return { amount: Math.round(n), per: 'year' };
  return null;
}
function ctcNewInput(R) {
  const cfg = R.active.config, fk = Object.keys(cfg.flags);
  return { version: R.active.id, basis: cfg.defaultBasis || 'gross', target: '', name: '', designation: '', grade: '', by: 'amount', hike: ctcHikeDefaults(), amounts: {},
    codes: Object.fromEntries(fk.map(k => [k, String(cfg.flags[k].default)])), link: { candidateId: '', candidate: '', lineId: '', position: '' } };
}
function ctcLineLabel(l) { return [l.MRF_No, l.Position].filter(Boolean).join(' · '); }
function ctcFillFromLine(f, l) {
  f.link.lineId = l.Line_ID; f.link.position = ctcLineLabel(l);
  if (!f.designation) f.designation = l.Designation || l.Position || '';
  if (!f.grade) f.grade = l.Grade || '';
}
/** Name, and the current and expected CTC on file as the hike comparison's current pay and ask (only when the text is clear). */
function ctcFillFromCandidate(f, c) {
  f.link.candidateId = c.Candidate_ID; f.link.candidate = c.Name || '';
  if (!f.name) f.name = c.Name || '';
  const H = f.hike = f.hike || ctcHikeDefaults(), cur = ctcParseMoney(c.Current_CTC), ask = ctcParseMoney(c.Expected_CTC);
  f.hikeNote = [c.Current_CTC ? `current “${c.Current_CTC}”` : '', c.Expected_CTC ? `expected “${c.Expected_CTC}”` : ''].filter(Boolean).join(', ');
  const per = (cur || ask || {}).per;
  if (per && !H.ctc && !H.ask) H.per = per;
  const to = x => !x ? '' : String(H.per === x.per ? x.amount : H.per === 'year' ? x.amount * 12 : Math.round(x.amount / 12));
  if (cur && !H.ctc) H.ctc = to(cur);
  if (ask && !H.ask) { H.ask = to(ask); H.askBasis = 'total_ctc'; }
}

  let c; try { c = await api('apiCtcGet', id); } catch (e) { $('#drawerBody').innerHTML = `<p class="miss">${esc(e)}</p>`; return; }
  const T = c.result.totals, mine = c.by === S.boot.user.email, older = c.version !== R.active.id;
  $('#drawerBody').innerHTML = `<div class="ctc-vh"><div class="dp-h"><b>${esc(c.name || 'No name given')}</b><span class="ctc-st ${ctcStClass(c.status)}">${esc(c.status)}</span></div>
      <div>${esc([c.designation, c.grade].filter(Boolean).join(' · ')) || '<span class="sub">No designation or grade</span>'}</div>
      <div class="sub">Rules ${esc(c.version)}${older ? ' (older than the rules in force, ' + esc(R.active.id) + ')' : ''} · made by ${esc(c.by)} on ${esc(c.at)}${c.issuedAt ? ` · issued by ${esc(c.issuedBy)} on ${esc(c.issuedAt)}` : ''}</div>
      ${c.candidate || c.position ? `<div class="sub">For ${[c.candidate ? 'candidate ' + esc(c.candidate) : '', c.position ? 'position ' + esc(c.position) : ''].filter(Boolean).join(' \u00b7 ')} <button class="linklike" id="coUnlink">Remove link</button></div>` : ''}
      ${c.rerunOf ? `<div class="sub">Re-run of ${esc(c.rerunOf)}</div>` : ''}${c.supersededBy ? `<div class="sub">Superseded by ${esc(c.supersededBy)}</div>` : ''}</div>
    <div class="readout"><div><span class="sub">Total CTC</span><b>${inr(T.totalCtc)}</b></div><div><span class="sub">Gross</span><b>${inr(T.gross)}</b></div><div><span class="sub">Net in-hand</span><b>${inr(T.net)}</b></div></div>
    ${c.status === 'Draft' && c.decisionNote ? `<div class="ctc-status warn" style="margin-top:12px">Returned by ${esc(c.decidedBy)} on ${esc(c.decidedAt)}: ${esc(c.decisionNote)}</div>` : ''}
    ${c.status === 'Pending approval' ? `<div class="ctc-status info" style="margin-top:12px">Submitted by ${esc(c.submittedBy)} on ${esc(c.submittedAt)}, waiting for approval.</div>` : ''}
    <div class="drawer-actions" style="position:static;flex-wrap:wrap;gap:8px;justify-content:flex-start;margin-top:14px">
      ${(c.status === 'Pending approval' ? (ctcCan('ctc_approve') || mine) : c.status === 'Draft' ? ctcCan('ctc_issue') : c.status !== 'Discarded') ? `<button class="btn primary" id="coLetter">${c.status === 'Pending approval' && ctcCan('ctc_approve') ? 'Review and approve…' : 'Letter…'}</button>` : ''}
      ${c.letter ? `<a class="btn" href="${esc(c.letter)}" target="_blank" rel="noopener">Open issued PDF</a>` : ''}
      ${c.status === 'Draft' && mine ? '<button class="btn" id="coEdit">Edit in calculator</button>' : ''}
      ${c.status !== 'Draft' && c.status !== 'Discarded' ? `<button class="btn" id="coRerun">Re-run on current rules</button>` : ''}
      ${c.status === 'Draft' && mine ? '<button class="btn" id="coDiscard">Discard draft</button>' : ''}</div>`;
  const load = rerun => {
    const i = c.inputs;
    S.ctcIn = { version: R.active.id, basis: i.basis, target: String(i.target), name: i.name || '', designation: i.designation || '', grade: i.grade || '', codes: Object.assign({}, i.codes), amounts: Object.assign({}, i.amounts),
      by: i.by || 'amount', hike: Object.assign(ctcHikeDefaults(), i.hike || {}), link: { candidateId: c.candidateId || '', candidate: c.candidate || '', lineId: c.lineId || '', position: c.position || '' } };
    const cfg = R.active.config;
    Object.keys(cfg.flags).forEach(k => { if (S.ctcIn.codes[k] === undefined) S.ctcIn.codes[k] = String(cfg.flags[k].default); });
    if (rerun) S.ctcIn.rerunOf = { id: c.id, version: c.version, result: c.result };
    else S.ctcIn.saved = Object.assign({}, c, { sig: ctcSig(S.ctcIn) });
    closeDrawer(); S.ctcTab = 'calc'; viewCtc(v);
  };
  if ($('#coUnlink')) $('#coUnlink').onclick = async e => { busy(e.target, true); try { await api('apiCtcLink', c.id, { candidateId: '', lineId: '' }); S.ctcList = null; toast('Link removed.'); ctcOpen(id, R, v); } catch (err) { toast(err, true); busy(e.target, false); } };
  if ($('#coLetter')) $('#coLetter').onclick = () => { closeDrawer(); ctcLetter(c, R, () => { S.ctcList = null; }); };
  if ($('#coEdit')) $('#coEdit').onclick = () => load(false);

    try { await api('apiCtcDiscard', c.id); toast(`${c.id} discarded.`); S.ctcList = null; closeDrawer(); viewCtc(v); } catch (e) { toast(e, true); }
  });
}

const CTC_L = {
  heading: ['Salary structure', 'वेतन संरचना'], ref: ['Ref', 'संदर्भ'], date: ['Date', 'दिनांक'],
  name: ['Name', 'नाम'], designation: ['Designation', 'पदनाम'], grade: ['Grade', 'ग्रेड'],
  component: ['Component', 'घटक'], monthly: ['Monthly', 'मासिक'], yearly: ['Yearly', 'वार्षिक'],
  earning: ['Earnings', 'आय'], deduction: ['Deductions', 'कटौती'], employer: ['Employer contribution', 'नियोक्ता का अंशदान'], annual: ['Other benefits', 'अन्य लाभ'],
  gross: ['Gross salary', 'सकल वेतन'], ded: ['Total deductions', 'कुल कटौती'], net: ['Net in-hand salary', 'शुद्ध वेतन (हाथ में)'],
  er: ['Total employer contribution', 'कुल नियोक्ता अंशदान'], grossCtc: ['Gross CTC', 'सकल CTC'], ann: ['Total other benefits', 'कुल अन्य लाभ'],
  total: ['Total CTC', 'कुल CTC'], words: ['Total CTC in words', 'कुल CTC शब्दों में'], perYear: ['per year', 'प्रति वर्ष'],
  terms: ['Terms', 'शर्तें'], for: ['For', 'कृते'], dateSign: ['Date', 'दिनांक'], draft: ['DRAFT', 'DRAFT']
};
function ctcWords(n) {
  n = Math.round(Math.abs(n));
  if (!n) return 'Zero';
  const a = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
  const t = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
  const two = x => x < 20 ? a[x] : t[Math.floor(x / 10)] + (x % 10 ? '-' + a[x % 10] : '');
  const three = x => (x >= 100 ? a[Math.floor(x / 100)] + ' Hundred' + (x % 100 ? ' ' : '') : '') + (x % 100 ? two(x % 100) : '');
  const parts = [], cr = Math.floor(n / 1e7), lk = Math.floor(n / 1e5) % 100, th = Math.floor(n / 1e3) % 100, rest = n % 1000;
  if (cr) parts.push((cr >= 1000 ? ctcWords(cr) : three(cr)) + ' Crore');
  if (lk) parts.push(two(lk) + ' Lakh');
  if (th) parts.push(two(th) + ' Thousand');
  if (rest) parts.push(three(rest));
  return parts.join(' ');
}
/** The letter as HTML (A4, 794 px wide). lang: 'en', 'hi' or 'both'. */

  const day = c.issuedAt ? c.issuedAt.split(',')[0] : fmtDate(today());
  const det = [['name', c.name, true], ['designation', c.designation], ['grade', c.grade]].filter(x => x[1] || x[2]);
  return `<div class="ctl${draft ? ' draft' : ''}">
    ${draft ? `<div class="ctl-wm">DRAFT</div>` : ''}
    <header><img src="data:image/jpeg;base64,${JDM_LOGO}" alt=""><div class="co"><b>${esc(lt.company)}</b>${lt.subheading ? `<span>${esc(lt.subheading)}</span>` : ''}</div>
      <dl><dt>${L('ref')}</dt><dd>${esc(c.id)}</dd><dt>${L('date')}</dt><dd>${esc(day)}</dd></dl></header>

    <div class="det">${det.map(x => `<div><span>${L(x[0])}</span><b>${x[1] ? esc(x[1]) : '<i class="line"></i>'}</b></div>`).join('')}</div>
    <table><thead><tr><th>${L('component')}</th><th class="n">${L('monthly')} (₹)</th><th class="n">${L('yearly')} (₹)</th></tr></thead><tbody>
      ${sec('earning', 'gross', T.gross)}${sec('deduction', 'ded', T.deductions)}
      <tr class="g"><td>${L('net')}</td><td class="n">${inr(T.net)}</td><td class="n">${inr(T.net * 12)}</td></tr>
      ${sec('employer', 'er', T.employer)}
      <tr class="g"><td>${L('grossCtc')}</td><td class="n">${inr(T.grossCtc)}</td><td class="n">${inr(T.grossCtc * 12)}</td></tr>
      ${sec('annual', 'ann', T.annual)}
      <tr class="gt"><td>${L('total')}</td><td class="n">${inr(T.totalCtc)}</td><td class="n">${inr(T.totalCtc * 12)}</td></tr></tbody></table>
    <p class="words"><span>${L('words')}</span> Rupees ${ctcWords(T.totalCtc * 12)} only ${L('perYear')}</p>

    <div class="sign"><div><i class="line"></i><span>${acc}</span><span class="d">${L('dateSign')}:</span></div>
      <div><i class="line"></i><span>${L('for')} ${esc(lt.company)}</span><span>${esc(lt.signatory)}</span></div></div>
    <footer>${esc(c.id)} · Rules ${esc(c.version)} · Prepared by ${esc(String(c.by).split('@')[0])}${c.decidedBy ? ' · approved by ' + esc(String(c.decidedBy).split('@')[0]) : c.issuedBy && c.issuedBy !== c.by ? ' · issued by ' + esc(String(c.issuedBy).split('@')[0]) : ''}${c.issuedAt ? ' · issued ' + esc(c.issuedAt) : ''}</footer>

}
let ctcFontReady = null;
function ctcFonts() {
  if (!ctcFontReady) {
    ctcFontReady = new Promise(res => {
      const l = document.createElement('link'); l.rel = 'stylesheet';
      l.href = 'https:' + String.fromCharCode(47, 47) + 'fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600&display=swap';
      l.onload = l.onerror = () => res(); document.head.appendChild(l);
      setTimeout(res, 4000);
    }).then(() => Promise.race([Promise.all([document.fonts.load('14px "Noto Sans Devanagari"', 'हिंदी'), document.fonts.load('600 14px "Noto Sans Devanagari"', 'हिंदी')]), new Promise(r => setTimeout(r, 4000))])).catch(() => { });
  }
  return ctcFontReady;
}
/** Draws the letter off-screen and returns a canvas (2x for print quality). */
async function ctcCanvas(html) {
  await Promise.all([loadScript(CDN_NPM + 'html2canvas@1.4.1/dist/html2canvas.min.js'), ctcFonts()]);
  const host = document.createElement('div'); host.className = 'ctl-host'; host.innerHTML = html; document.body.appendChild(host);
  try { await document.fonts.ready; return await window.html2canvas(host.firstElementChild, { scale: 2, backgroundColor: '#ffffff', logging: false, useCORS: true }); }
  finally { host.remove(); }
}
async function ctcPdf(canvas) {
  const JsPDF = await pdfLib(); const doc = new JsPDF({ unit: 'mm', format: 'a4' });
  const pw = 210, ph = 297, pxPerPage = Math.floor(canvas.width * ph / pw);
  for (let y = 0, p = 0; y < canvas.height; y += pxPerPage, p++) {
    const h = Math.min(pxPerPage, canvas.height - y), c = document.createElement('canvas'); c.width = canvas.width; c.height = h;
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, h); g.drawImage(canvas, 0, y, canvas.width, h, 0, 0, canvas.width, h);
    if (p) doc.addPage();
    doc.addImage(c.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, pw, h * pw / canvas.width);
  }
  return doc;
}
function ctcFileName(c, ext) { return `${c.id}-${(c.name || 'salary-structure').replace(/[^\w]+/g, '-').replace(/^-|-$/g, '').toLowerCase()}.${ext}`; }
function ctcLetter(c, R, onIssued) {
  const cfg = c.version === R.active.id ? R.active.config : null;
  let d = $('#ctlDialog');
  if (!d) { document.body.insertAdjacentHTML('beforeend', '<dialog id="ctlDialog" class="pm-dialog wide ctl-dialog" aria-labelledby="ctlTitle"></dialog>'); d = $('#ctlDialog'); }
  let lang = c.language || S.ctcLang || 'en';
  const mine = c.by === S.boot.user.email;
  const render = async () => {
    const issued = c.status === 'Issued' || c.status === 'Superseded', pending = c.status === 'Pending approval';
    const approver = ctcCan('ctc_approve'), needsApproval = R.approval && !approver;
    const conf = cfg || (await ctcVersionConfig(c.version, R));
    if (lang !== 'en') await ctcFonts();
    const html = ctcLetterHtml(c, conf, lang, !issued);
    const picker = (issued || (pending && !approver)) ? `<span class="hint">Language: ${esc({ en: 'English', hi: 'Hindi', both: 'English and Hindi' }[lang] || '')}</span>`
      : `<div class="seg ctl-lang" role="radiogroup" aria-label="Letter language">${[['en', 'English'], ['hi', 'Hindi'], ['both', 'Both']].map(([k, l]) => `<label class="seg-o"><input type="radio" name="ctlLang" value="${k}" ${lang === k ? 'checked' : ''}><span>${l}</span></label>`).join('')}</div>`;
    const hint = issued ? `Issued by ${esc(c.issuedBy)} on ${esc(c.issuedAt)}${c.decidedBy ? `, approved by ${esc(c.decidedBy)}` : ''}. The letter is locked.`
      : pending ? (approver ? `Submitted by ${esc(c.submittedBy)} on ${esc(c.submittedAt)}. Check the letter, then approve it (it is issued and kept in Drive) or return it with a note.` : `Waiting for approval since ${esc(c.submittedAt)}.`)
      : needsApproval ? 'Check the letter, then submit it. An approver issues it; you will see it as issued once they do.'
      : 'Check the letter, then issue it. Issuing locks the figures and keeps the PDF in Drive; downloads are available only for issued letters.';
    const note = c.status === 'Draft' && c.decisionNote ? `<div class="ctc-status warn" style="margin:0 0 10px">Returned by ${esc(c.decidedBy)}: ${esc(c.decisionNote)}</div>` : '';
    const btns = issued ? `<button class="btn" id="ctlPng">Download image</button><button class="btn primary" id="ctlPdf">Download PDF</button>`
      : pending ? `${approver ? `<input id="ctlNote" class="ctl-note" placeholder="Note to the maker (needed to return it)" maxlength="500"><button class="btn" id="ctlReturn">Return</button><button class="btn primary" id="ctlApprove">Approve and issue</button>` : ''}${mine ? '<button class="btn" id="ctlWithdraw">Withdraw</button>' : ''}`
      : needsApproval ? '<button class="btn primary" id="ctlSubmit">Submit for approval</button>' : '<button class="btn primary" id="ctlIssue">Issue letter</button>';
    d.innerHTML = `<div class="dp-h"><h2 id="ctlTitle">Letter · ${esc(c.id)}</h2><span class="ctc-st ${ctcStClass(c.status)}">${esc(CTC_STATUS[c.status] || c.status)}</span>${picker}</div>${note}
      <div class="ctl-view"><div class="ctl-scale">${html}</div></div>
      <div class="ctl-foot"><span class="hint">${hint}</span><button class="btn" data-close>Close</button>${btns}</div>`;
    const fit = () => { const box = $('.ctl-view', d), sc = $('.ctl-scale', d); if (!box || !sc) return; const k = Math.min(1, (box.clientWidth - 24) / 794); sc.style.transform = `scale(${k})`; sc.style.height = (sc.firstElementChild.offsetHeight * k) + 'px'; sc.style.width = (794 * k) + 'px'; };
    requestAnimationFrame(fit); window.onresize = fit;
    $$('[data-close]', d).forEach(b => b.onclick = () => d.close());
    $$('input[name="ctlLang"]', d).forEach(x => x.onchange = () => { lang = S.ctcLang = x.value; render(); });
    const make = async btn => { busy(btn, true, 'Preparing…'); try { return await ctcCanvas(ctcLetterHtml(c, conf, lang, false)); } finally { busy(btn, false); } };
    const done = (rec, msg) => { Object.assign(c, rec); S.ctcList = null; if (onIssued) onIssued(rec); toast(msg); render(); };
    const pdfOf = async b => (await ctcPdf(await make(b))).output('datauristring').split(',')[1];
    if ($('#ctlIssue', d)) twoStep($('#ctlIssue', d), 'Click again to issue', async () => {
      const b = $('#ctlIssue', d);
      try { const pdf = await pdfOf(b); busy(b, true, 'Issuing…'); done(await api('apiCtcIssue', c.id, { language: lang, pdf }), `${c.id} issued. The PDF is saved in Drive.`); }
      catch (e) { toast(e, true); busy(b, false, 'Issue letter'); }
    });
    if ($('#ctlSubmit', d)) twoStep($('#ctlSubmit', d), 'Click again to submit', async () => {
      const b = $('#ctlSubmit', d);
      try { busy(b, true, 'Submitting…'); done(await api('apiCtcSubmit', c.id, { language: lang }), `${c.id} submitted for approval.`); }
      catch (e) { toast(e, true); busy(b, false, 'Submit for approval'); }
    });
    if ($('#ctlApprove', d)) twoStep($('#ctlApprove', d), 'Click again to approve', async () => {
      const b = $('#ctlApprove', d);
      try { const pdf = await pdfOf(b); busy(b, true, 'Approving…'); done(await api('apiCtcReview', c.id, { action: 'Approve', language: lang, pdf }), `${c.id} approved and issued. The PDF is saved in Drive.`); }
      catch (e) { toast(e, true); busy(b, false, 'Approve and issue'); }
    });
    if ($('#ctlReturn', d)) $('#ctlReturn', d).onclick = async e => {
      const note = $('#ctlNote', d).value.trim();
      if (note.length < 5) return toast('Write a note for the maker: what to change.', true);
      busy(e.target, true, 'Returning…');
      try { done(await api('apiCtcReview', c.id, { action: 'Return', note }), `${c.id} returned to ${c.by.split('@')[0]}.`); } catch (err) { toast(err, true); busy(e.target, false, 'Return'); }
    };
    if ($('#ctlWithdraw', d)) $('#ctlWithdraw', d).onclick = async e => {
      busy(e.target, true, 'Withdrawing…');
      try { done(await api('apiCtcReview', c.id, { action: 'Withdraw' }), `${c.id} is a draft again.`); } catch (err) { toast(err, true); busy(e.target, false, 'Withdraw'); }
    };
    if ($('#ctlPdf', d)) $('#ctlPdf', d).onclick = async e => { try { (await ctcPdf(await make(e.target))).save(ctcFileName(c, 'pdf')); e.target.textContent = 'Download PDF'; } catch (err) { toast(err, true); } };
    if ($('#ctlPng', d)) $('#ctlPng', d).onclick = async e => { try { const cv = await make(e.target); e.target.textContent = 'Download image'; cv.toBlob(b => saveBlob(b, ctcFileName(c, 'png')), 'image/png'); } catch (err) { toast(err, true); } };
  };
  d.innerHTML = '<p class="muted">Preparing the letter…</p>';
  if (!d.open) d.showModal();
  d.onclose = () => { window.onresize = null; };
  render().catch(e => { d.innerHTML = `<p class="miss">${esc(e)}</p><div class="ctl-foot"><button class="btn" data-close>Close</button></div>`; $('[data-close]', d).onclick = () => d.close(); });
}
/** The rules a calculation was worked out on (labels, notes and letter details come from that version). */

/** True when an amount, %, cap, "up to" or condition value is left blank or is not a number. */
function ctcBlank(cfg) {
  const keys = { amount: 1, pct: 1, cap: 1, value: 1, upto: 1 };
  let bad = false;
  const walk = (o, slabLast) => { if (!o || typeof o !== 'object' || bad) return; Object.keys(o).forEach(k => {
    const x = o[k];
    if (keys[k] && (x === '' || (typeof x === 'number' && !isFinite(x))) && !(k === 'upto' && slabLast)) bad = true;
    else if (k === 'slabs' && Array.isArray(x)) x.forEach((sl, i) => walk(sl, i === x.length - 1));
    else if (typeof x === 'object') walk(x); }); };
  cfg.components.forEach(c => walk(c));
  return bad;
}

async function openJdPicker(onPick, currentUrl) {
  let d = $('#jdDialog');
  if (!d) { document.body.insertAdjacentHTML('beforeend', '<dialog id="jdDialog" class="pm-dialog wide" aria-labelledby="jdTitle"></dialog>'); d = $('#jdDialog'); }
  d.innerHTML = `<h2 id="jdTitle">Choose a JD from the JD folder</h2>${skRows(6, 2)}`;
  if (!d.open) d.showModal();
  let res;
  try { res = await api('apiListJds'); } catch (e) { d.innerHTML = `<h2 id="jdTitle">JD folder</h2><p class="miss">${esc(e)}</p><div class="drawer-actions" style="position:static"><button class="btn" id="jdClose">Close</button></div>`; $('#jdClose').onclick = () => d.close(); return; }
  const curId = (String(currentUrl || '').match(new RegExp('[-\\w]{25,}')) || [''])[0];
  const kb = n => n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';
  d.innerHTML = `<div class="app-head"><div><h2 id="jdTitle">Choose a JD from the JD folder</h2><p class="sub">${res.files.length} file${res.files.length === 1 ? '' : 's'} in \u201c${esc(res.folderName)}\u201d. Save JD attachments from email into this folder and they appear here.</p></div>
      <a class="btn" href="${esc(res.folderUrl)}" target="_blank" rel="noopener">Open JD folder in Drive</a></div>
    <div class="field" style="margin:12px 0"><label for="jdQ">Search</label><input id="jdQ" type="search" placeholder="File name, position or MRF no"></div>
    <div id="jdList" class="jd-list"></div>
    <div class="drawer-actions" style="position:static"><button class="btn" id="jdClose">Close</button></div>`;
  $('#jdClose').onclick = () => d.close();
  const draw = () => {
    const q = $('#jdQ').value.trim().toLowerCase();
    const rows = res.files.filter(x => !q || [x.name, ...x.usedBy.map(u => u.position + ' ' + u.mrf)].join(' ').toLowerCase().includes(q));
    $('#jdList').innerHTML = rows.length ? rows.map(x => `<div class="jd-row ${x.id === curId ? 'current' : ''}">
        <div><b>${esc(x.name)}</b><span class="sub">Updated ${fmtDate(x.updated)} \u00b7 ${kb(x.size)}${x.usedBy.length ? ' \u00b7 used by ' + x.usedBy.map(u => esc((u.mrf ? u.mrf + ' ' : '') + u.position)).join(', ') : ' \u00b7 not used yet'}${x.supported ? '' : ' \u00b7 <span class="miss">cannot be previewed in the app</span>'}</span></div>
        <div class="jd-acts"><a class="btn" href="${esc(x.url)}" target="_blank" rel="noopener">Open</a>${x.id === curId ? '<span class="badge ok-b">Attached</span>' : `<button class="btn primary" data-jd="${esc(x.id)}">Use this JD</button>`}</div></div>`).join('')
      : `<div class="empty">${res.files.length ? 'No JD matches that search.' : 'The JD folder is empty. Save JD files into it from Drive, or upload a JD on a position.'}</div>`;
    $$('[data-jd]', d).forEach(b => b.onclick = () => { const file = res.files.find(x => x.id === b.dataset.jd); d.close(); onPick(file); });
  };
  $('#jdQ').oninput = debounce(draw, 200);
  draw();
}
</script>
