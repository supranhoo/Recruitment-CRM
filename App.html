    if (r.same && have) return PACKED.includes(fn) ? have.data : JSON.parse(JSON.stringify(have.data));

    FRESH.delete(key); FRESH.set(key, { v: r.v, data: PACKED.includes(fn) ? data : JSON.parse(JSON.stringify(data)) });

function tatRuleFor(grade, start) {
  const lv = String(grade || '').trim().toUpperCase(), rules = S.boot.tatRules || {};
  const list = rules[lv] || (/^T\d$/.test(lv) ? rules.T : null);
  if (list && list.length) { const d = start || today(); let pick = list[0]; list.forEach(r => { if (r.eff <= d) pick = r; }); return pick; }
  const g = S.boot.grades.find(x => x.grade === lv);
  return { std: g ? g.tat : 50, grace: 30, risk: 0.8, version: '', eff: '' };
}
function previewTat(d) {
  const a = String(d.Approval_Status || '').toUpperCase();
  let s = d.Replaced_By ? 'Replaced' : a === 'NO VACANCY' ? 'No Vacancy' : a === 'NOT NEEDED' ? 'Not Needed' : a === 'ON HOLD' ? 'On Hold'
    : a === 'APPROVED' ? (String(d.Offer_Sent).toUpperCase() !== 'YES' ? 'Open' : d.Actual_DOJ ? 'Closed' : 'Offered') : '';
  let end = d.Actual_DOJ || (s === 'No Vacancy' ? d.No_Vacancy_Date : ['Not Needed','On Hold'].includes(s) ? d.Not_Needed_Date : '');
  const hold = Number(d.Hold_Days) || 0;
  /* Approved exemptions come from the server (extra days and paused days per clock); the notice extension is recalculated
     here as it is typed, and drops to 0 if the Head of HR rejected it. */
  const clock = (start, pos) => {
    const rule = tatRuleFor(d.Grade, start), notice = d.Notice_Ext_Status === 'Rejected' ? 0 : Math.max((Number(d.Notice_Period_Days) || 0) - rule.grace, 0);
    const extra = Number(pos ? d.Pos_Exempt_Extra_Days : d.Exempt_Extra_Days) || 0, paused = Number(pos ? d.Pos_Paused_Days : d.Paused_Days) || 0;
    const ex = notice + extra, fin = rule.std + ex;
    const days = start ? Math.max(0, Math.round((Date.parse(end || today()) - Date.parse(start)) / 86400000) - hold - paused) : '';
    let r = '';
    if (days !== '') r = ACTIVE.includes(s) ? (days > fin ? 'Overdue' : days >= rule.risk * fin ? 'At risk' : 'On track') : (days > fin ? 'Missed' : 'Achieved');
    return { std: rule.std, ex, fin, days, r, version: rule.version, notice, extra, paused };
  };
  const start = d.TAT_Start_From || d.Assigned_On || d.Approved_On || d.Receipt_Date, pstart = d.TAT_Start_From || d.Approved_On || d.Receipt_Date;
  const rc = clock(start, false), pc = clock(pstart, true);
  return { Position_Status: s, Standard_TAT: rc.std, Exemption_Days: rc.ex, Final_TAT: rc.fin, Days_Taken: rc.days, TAT_Result: rc.r, _rule: rc.version, _rc: rc, _pc: pc,
    Pos_Final_TAT: pc.fin, Pos_Days_Taken: pc.days, Pos_TAT_Result: pc.r, _pstart: pstart, _prule: pc.version,
    _start: start, _hold: hold, _basis: d.TAT_Start_From ? 'original MRF start' : d.Assigned_On ? 'position assigned' : d.Approved_On ? 'MRF approved' : 'MRF received' };
}

      <div>Position TAT<b>${t.Pos_Days_Taken === '' ? '—' : t.Pos_Days_Taken} / ${t.Pos_Final_TAT} d \u00b7 ${esc(t.Pos_TAT_Result || '—')}</b>${parts(t._pc)}${t._pstart ? `<span class="sub">from ${fmtDate(t._pstart)} (${t._basis === 'original MRF start' ? 'original MRF start' : 'MRF approved'})${ruleTag(t._prule)}</span>` : ''}</div>`;
  };

  if (!isNew) exemptSectionInto($('#posExempt', body), p, async () => {
    try { const l = await refreshLine(p.Line_ID); ['Final_TAT', 'Days_Taken', 'TAT_Result', 'Exemption_Days', 'Exempt_Extra_Days', 'Paused_Days', 'Pos_Exempt_Extra_Days', 'Pos_Paused_Days',
      'Notice_Ext_Status', 'Pos_Final_TAT', 'Pos_Days_Taken', 'Pos_TAT_Result'].forEach(k => { data[k] = l[k]; }); readout(); S.posStale = true; } catch (e) { }
  });
  if (!isNew) lineTasksInto($('#posTasks', body), p.Line_ID);
  /* The drawer opens from the list in memory; the position itself is re-read from the server so an edit is never saved

  if (!isNew && !ro) {
    const tok = S.drawerTok; let typed = false;
    $('#posForm').addEventListener('input', () => { typed = true; });
    refreshLine(p.Line_ID).then(fr => {
      if (S.drawerTok !== tok || !$('#drawer').classList.contains('open')) return;
      const changed = Object.keys(fr).some(k => k[0] !== '_' && String(fr[k] == null ? '' : fr[k]) !== String(p[k] == null ? '' : p[k]));
      if (!changed) return;
      if (!typed) positionDrawer(fr);
      else { const d = $('#tab-details'); if (d) d.insertAdjacentHTML('afterbegin', '<div class="note warn-note">This position was changed by someone else after you opened it. Close it and open it again before saving, so their change is not overwritten.</div>'); }
    }).catch(() => { });
  }
  const afterClose = () => { closeDrawer(); S.posStale = true; if (S.view === 'positions' || S.view === 'pipeline' || S.view === 'reconcile') go(S.view, false); };
  if ($('#posClose', body)) $('#posClose', body).onclick = () => closePositionDialog(p, afterClose);
  if ($('#posResume', body)) $('#posResume', body).onclick = () => resumePositionDialog(p, afterClose);
  if ($('#posRestore', body)) $('#posRestore', body).onclick = async e => { const why = prompt('Why is this position being restored?'); if (!why) return; busy(e.target, true);
    try { await api('apiRestorePosition', p.Line_ID, why); toast('Position restored.'); afterClose(); } catch (err) { toast(err, true); busy(e.target, false); } };
  if ($('#posUndoInt', body)) $('#posUndoInt', body).onclick = async e => { const why = prompt('Why is this internal fill being undone?'); if (!why) return; busy(e.target, true);
    try { await api('apiUndoInternalFill', p.Line_ID, why); toast('Internal fill undone; the position is open again.'); afterClose(); } catch (err) { toast(err, true); busy(e.target, false); } };
  $('#posForm').addEventListener('input', readout);
  if (!isNew) bindAttachmentViews('MRF', p.Line_ID, body);
  if ($('#jdPickBtn', body)) $('#jdPickBtn', body).onclick = () => openJdPicker(file => {
    $('#f__jdFileId', body).value = file.id; const el = $('#jdPicked', body); el.textContent = 'Chosen: ' + file.name + ' (attached when you save)'; el.className = '';
  });
  if ($('#jdMakeBtn', body)) $('#jdMakeBtn', body).onclick = () => { if (isNew) { toast('Save the position first, then create its JD.', true); return; } openJdMaker(p.Line_ID); };
  if ($('#openPipe', body)) $('#openPipe', body).onclick = () => { S.pipe = Object.assign(S.pipe || {}, { line: p.Line_ID }); closeDrawer(); go('pipeline', true); };
  initMulti(body);
  const gsel = $('#f_Grade', body); if (gsel) gsel.addEventListener('change', () => {
    $('#hint_Tech_Panel', body).textContent = 'Policy for this grade: ' + policyPanel(gsel.value);
    const dsel = $('#f_Designation', body); if (!dsel) return;
    const was = dsel.value, keep = p && p.Grade === gsel.value ? p.Designation : '', l = desigOpts(gsel.value, keep);
    dsel.innerHTML = opts(l, l.find(d => d.toLowerCase() === was.toLowerCase()) || keep || '');
    if (l.length === 1 && !dsel.value) dsel.value = l[0];
    const lab = $('label[for=f_Designation]', body); if (lab) lab.textContent = 'Designation' + (l.length ? ' *' : '');
  });
  const fR = $('#f_Receipt_Date', body), fA = $('#f_Approved_On', body), fS = $('#f_Assigned_On', body), fRec = $('#f_Recruiter', body);
  if (fR && fA && fS) {
    let aAuto = fA.value === fR.value, sAuto = fS.value === fA.value;
    const origRec = p ? String(p.Recruiter || '') : '', origAssigned = fS.value;
    const hintS = $('#f_Assigned_On', body).parentElement.querySelector('.hint');
    const baseHint = hintS ? hintS.textContent : '';
    const onA = byUser => { if (byUser) aAuto = fA.value === fR.value; if (sAuto && !fS.readOnly) fS.value = fA.value; readout(); };
    fR.addEventListener('change', () => { if (aAuto && !fA.readOnly) { fA.value = fR.value; onA(false); } });
    fA.addEventListener('change', () => onA(true));
    fS.addEventListener('change', () => { sAuto = fS.value === fA.value; });
    if (fRec && !isNew) fRec.addEventListener('change', () => {
      const moved = fRec.value && fRec.value !== origRec;
      fS.value = moved ? today() : origAssigned; sAuto = false;
      if (hintS) hintS.textContent = moved ? 'Reassigned to ' + fRec.value + ': TAT restarts from this date for the new recruiter. The original date stays in the change history.' : baseHint;
      readout();
    });
  }
  $('#posForm').addEventListener('change', readout);
  $$('.tabs button', body).forEach(b => b.addEventListener('click', () => {
    $$('.tabs button', body).forEach(x => x.setAttribute('aria-selected', x === b));
    ['details','log','cands'].forEach(t => $('#tab-' + t).hidden = t !== b.dataset.t);
    if (b.dataset.t === 'log') renderLineLog(p);
    if (b.dataset.t === 'cands') renderLineCands(p);
  }));
  if (ro) return;
  $('#pCancel').onclick = closeDrawer;
  $('#pSave').onclick = async () => {
    const d = Object.assign({ Line_ID: isNew ? '' : p.Line_ID }, readForm($('#posForm')));
    const np = $('.att-input[data-field="Notice_Proof_File"]', $('#posForm')); d._noticeProof = !!(np && np.files[0]);
    const jdId = d._jdFileId; delete d._jdFileId;
    const bad = checkAttachments($('#posForm')); if (bad) return toast(bad, true);
    const btn = $('#pSave'); busy(btn, true, 'Saving…');
    try {
      if (isNew) {
        const n = Number(d._count) || 1; delete d._count;
        const saved = await api('apiAddPositionLines', d, n);
        if (jdId) {
          try { const j = await api('apiUseJd', saved.map(x => x.Line_ID), jdId); saved.forEach(x => { x.JD_File = j.url; }); }
          catch (e) { toast('Position added, but the JD could not be attached: ' + e, true); }
        }
        S.positions = saved.concat(S.positions);
        toast(n > 1 ? `Added ${n} position lines` : 'Position added');
      } else {
        const saved = await api('apiSavePosition', d);
        if (jdId) saved.JD_File = (await api('apiUseJd', [saved.Line_ID], jdId)).url;
        const hasFiles = $$('.att-input', $('#posForm')).some(x => x.files[0]);
        if (hasFiles) {
          busy(btn, true, 'Uploading files…');
          try { Object.assign(saved, await uploadAttachments('MRF', saved.Line_ID, $('#posForm'))); }
          catch (e) { toast('Position saved, but a file upload failed: ' + e, true); }
        }
        S.positions = S.positions.map(x => x.Line_ID === saved.Line_ID ? saved : x);
        toast(hasFiles ? 'Changes and files saved' : 'Changes saved');
      }
      closeDrawer(); if (S.view === 'positions' || S.view === 'overview') go(S.view, false);
    } catch (e) { toast(e, true); busy(btn, false, isNew ? 'Add position' : 'Save changes'); }
  };
}

async function renderLineLog(p) {
  const el = $('#tab-log'); el.innerHTML = `<div style="margin-top:12px">${skRows(6, 5)}</div>`;
  const rows = await fresh('apiListFunnel', { lineId: p.Line_ID });
  const tot = {}; METRICS.forEach(([k]) => tot[k] = rows.reduce((s, r) => s + (Number(r[k]) || 0), 0));
  el.innerHTML = `
    <div class="readout" style="grid-template-columns:repeat(3,1fr);margin-top:12px">${METRICS.map(([k, l]) => `<div>${l}<b>${tot[k]}</b></div>`).join('')}</div>
    <h3 id="llHead" style="margin:18px 0 8px;font-size:16px">Log today's activity</h3>

  $$('#llHist [data-edit]', el).forEach(b => b.onclick = () => {
    const r = rows.find(x => x.Entry_ID === b.dataset.edit);

}

function activeLineOptions(selected) {
  const mine = S.positions.filter(p => ACTIVE.concat(['On Hold']).includes(p.Position_Status) && (isLead() || String(p.Recruiter).trim() === S.boot.user.recruiter));
  return opts(mine.sort((a, b) => String(a.MRF_No).localeCompare(String(b.MRF_No))).map(p => [p.Line_ID, lineLabel(p)]), selected);
}
function dailyFormHtml(fixedLine, data) {
  data = data || { Entry_Date: today() };
  // The list shows pipeline counts for these columns; the form must not carry them (they are counted, never typed).
  if (String(data.Entry_Date) >= (S.boot.cutover || '2026-10-05')) { data = Object.assign({}, data); FUNNEL_PIPED_.forEach(k => { data[k] = ''; }); }
  return `<div class="dailyform" data-entry="${esc(data.Entry_ID || '')}">
    <div class="grid">
      ${fixedLine ? `<input type="hidden" name="Line_ID" value="${esc(fixedLine)}">` : `<div class="field wide"><label for="dl_line">Position *</label><select id="dl_line" name="Line_ID">${activeLineOptions(data.Line_ID)}</select></div>`}
      <div class="field"><label for="dl_date">Date *</label><input id="dl_date" type="date" name="Entry_Date" value="${esc(data.Entry_Date)}" max="${today()}"></div>
      <div class="field"><label for="dl_fb">Feedback from dept</label><select id="dl_fb" name="FB_From_Dept">${opts(['Yes','No','Pending'], data.FB_From_Dept)}</select></div>
    </div>
    <p class="hint dl-pipe-note" hidden>From ${fmtDate(S.boot.cutover || '2026-10-05')}, HR 1st round, shared, shortlisted, interviews and selected are counted from the Pipeline. Log only CVs sourced and reviewed here.</p>
    <div class="counts" style="margin-top:12px">${METRICS.map(([k, l]) => `<div class="field${['CV_Sourced', 'CV_Reviewed'].includes(k) ? '' : ' dl-pipe'}"><label for="dl_${k}">${l}</label><input id="dl_${k}" type="number" min="0" step="1" name="${k}" value="${esc(data[k] || '')}" placeholder="0"></div>`).join('')}</div>
    <div class="field" style="margin-top:12px"><label for="dl_rm">Remarks</label><input id="dl_rm" name="Remarks" value="${esc(data.Remarks || '')}" placeholder="e.g. 2 candidates scheduled for F2F with HOD"></div>
    <div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="btn primary dl-save">${data.Entry_ID ? 'Save changes' : 'Log activity'}</button></div>
  </div>`;
}
function bindDailyForm(root, after) {
  const f = $('.dailyform', root);
  const syncPipe = () => {
    const dt = ($('[name=Entry_Date]', f) || {}).value || today(), piped = dt >= (S.boot.cutover || '2026-10-05');
    $$('.dl-pipe', f).forEach(x => { x.hidden = piped; if (piped) { const i = $('input', x); if (i) i.value = ''; } });
    const n = $('.dl-pipe-note', f); if (n) n.hidden = !piped;
  };
  if ($('[name=Entry_Date]', f)) $('[name=Entry_Date]', f).addEventListener('change', syncPipe);
  syncPipe();
  $('.dl-save', f).onclick = async () => {
    const d = readForm(f); d.Entry_ID = f.dataset.entry;
    if ((d.Entry_Date || today()) >= (S.boot.cutover || '2026-10-05')) FUNNEL_PIPED_.forEach(k => { d[k] = 0; });   // counted from the Pipeline, never typed
    const btn = $('.dl-save', f), label = btn.textContent; busy(btn, true, 'Saving…');
    try { const saved = await api('apiSaveFunnel', d); toast(d.Entry_ID ? 'Entry updated' : 'Activity logged'); after(saved); }
    catch (e) { toast(e, true); busy(btn, false, label); }
  };
}
function bindEntryEdits(root, rows, after) {
  $$('[data-edit]', root).forEach(b => b.onclick = e => {
    e.stopPropagation();
    const r = rows.find(x => x.Entry_ID === b.dataset.edit);
    const d = openDrawer('Edit activity entry', `<p class="hint" style="margin:0 0 10px">You can change this entry until midnight today. After that it is locked.</p>` + dailyFormHtml(null, r));
    bindDailyForm(d, () => { closeDrawer(); after(); });
  });
}
const FUNNEL_PIPED_ = ['HR_1st_Round', 'CV_Shared_Dept', 'Shortlisted_Dept', 'Interviews_Done', 'Selected_Final'];
function funnelTable(rows, withPosition) {
  if (!rows.length) return '<div class="empty">No activity logged for this period.</div>';
  const tot = {}; METRICS.forEach(([k]) => tot[k] = rows.reduce((s, r) => s + (Number(r[k]) || 0), 0));
  const cut = S.boot.cutover || '2026-10-05', anyPiped = rows.some(r => String(r.Entry_Date) >= cut);
  window._fnPeople = window._fnPeople || {};
  const cell = (r, k, i) => {
    const n = Number(r[k]) || 0, ppl = r.People && r.People[k];
    if (ppl && ppl.length) { window._fnPeople[i + '|' + k] = { list: ppl, label: (METRICS.find(m => m[0] === k) || [])[1] || k, day: r.Entry_Date }; return `<td class="num pipe"><button type="button" class="pipe-n" data-pm="${i}|${k}" title="Counted from the Pipeline. Click to see the candidates.">${n}</button></td>`; }
    return `<td class="num${FUNNEL_PIPED_.includes(k) && String(r.Entry_Date) >= cut ? ' pipe' : ''}">${n || ''}</td>`;
  };
  return `<div class="table-wrap"><table><thead><tr><th>Date</th>${withPosition ? '<th>Position</th><th>Recruiter</th>' : ''}
    ${METRICS.map(([, l, s]) => `<th class="num" title="${l}">${s}</th>`).join('')}<th>Remarks</th><th><span class="sr-only">Edit</span></th></tr></thead><tbody>
    ${rows.map((r, i) => { const p = lineById(r.Line_ID); return `<tr data-entry="${esc(r.Entry_ID)}" style="cursor:default"><td class="nw">${fmtDate(r.Entry_Date)}</td>
      ${withPosition ? `<td>${esc(p ? p.Position : r.Line_ID)}<span class="sub">${esc(r.MRF_No)}</span></td><td>${esc(r.Recruiter)}</td>` : ''}
      ${METRICS.map(([k]) => cell(r, k, i)).join('')}<td class="remarks">${r.derived ? '<span class="sub">Moves in the Pipeline</span>' : esc(r.Remarks)}${r.FB_From_Dept ? `<span class="sub">FB: ${esc(r.FB_From_Dept)}</span>` : ''}</td>
      <td class="nw">${r.derived ? '<span class="locked" title="Counted from the candidates you moved in the Pipeline">Pipeline</span>' : r.canEdit ? `<button class="btn sm" data-edit="${esc(r.Entry_ID)}">Edit</button>` : `<span class="locked" title="Entries can be changed only on the day they are saved">Locked</span>`}</td></tr>`; }).join('')}
    <tr style="font-weight:600;cursor:default"><td>Total</td>${withPosition ? '<td></td><td></td>' : ''}${METRICS.map(([k]) => `<td class="num">${tot[k]}</td>`).join('')}<td></td><td></td></tr>
    </tbody></table></div>${anyPiped ? `<p class="hint">From ${fmtDate(cut)}, the columns after \u201cReviewed\u201d are counted from the candidates moved in the Pipeline (click a number to see who). Only CVs and Reviewed are typed here.</p>` : ''}`;
}

const CVP_LEVEL_ = { found: 'from CV', check: 'check' };
function cvpDur(m) { if (m == null) return '—'; const y = Math.floor(m / 12), r = m % 12; return (y ? y + ' y ' : '') + (r || !y ? r + ' m' : '').trim(); }
function cvpMonth(ym) { if (!ym) return ''; const p = ym.split('-'); return ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][+p[1] - 1] + ' ' + p[0]; }
async function cvProfileSection(el, c) {

        ${R.hasCv ? '<button class="btn" id="cvpBuild">Build the profile from the saved CV</button>' : '<p class="hint">Attach a CV first (below), then build the profile.</p>'}<span class="hint" id="cvpMsg"></span></section>`;

    }

    const risks = d.risks.filter(x => x.level !== 'info'), infos = d.risks.filter(x => x.level === 'info');

    el.innerHTML = `<section class="app-sec cvp"><div class="dp-h"><h3 style="margin:0">CV profile</h3><span class="hint">${esc(R.source)} · read ${esc(R.parsedOn)}${R.reviewedBy ? ` · <b>reviewed</b> by ${esc(String(R.reviewedBy).split('@')[0])}` : ' · not reviewed yet'}</span></div>
      <p class="cvp-conf"><span class="badge ${d.confidence.level === 'High' ? 'ok' : ''}">Reading confidence: ${esc(d.confidence.level)} (${d.confidence.score}/100)</span> <span class="hint">${d.confidence.ocr ? 'Read by OCR. ' : ''}Facts come from the CV text; anything marked “check” is a guess to confirm.</span></p>

      ${emp.length ? `<div class="table-wrap"><table class="bgv-table"><thead><tr><th>Employer</th><th>Role</th><th>From</th><th>To</th><th class="num">Duration</th><th>Key responsibilities</th></tr></thead><tbody>${emp.map(e => `<tr><td><b>${esc(e.employer) || nf}</b>${e.conf === 'check' ? ' <span class="pbadge check">check</span>' : ''}</td><td>${esc(e.role) || nf}</td><td class="nw">${cvpMonth(e.start)}${e.approx ? '*' : ''}</td><td class="nw">${e.current ? 'Present' : cvpMonth(e.end)}</td><td class="num">${cvpDur(e.months)}</td><td>${e.duties.length ? esc(e.duties.join(' · ')) : nf}</td></tr>`).join('')}</tbody></table></div>${emp.some(e => e.approx) ? '<p class="hint">* year only in the CV; the month is not known.</p>' : ''}` : `<p>${nf} — no dated employment history could be read from the CV.</p>`}
      ${risks.length || infos.length ? `<h4>Risks and observations</h4><ul class="cvp-risks">${risks.map(x => `<li class="${x.level === 'warn' ? 'miss' : ''}">${esc(x.text)}</li>`).join('')}${infos.map(x => `<li class="muted">${esc(x.text)}</li>`).join('')}</ul>` : '<h4>Risks and observations</h4><p class="muted">None found from the dates in the CV.</p>'}
      <h4>Education</h4>${p.education.length ? `<div class="table-wrap"><table class="bgv-table"><thead><tr><th>Level</th><th>Discipline</th><th>Institute</th><th>Year</th><th>Score</th></tr></thead><tbody>${p.education.map(e => `<tr><td>${esc(e.level)}</td><td>${esc(e.discipline) || nf}</td><td>${esc(e.institute) || nf}</td><td>${esc(e.year) || nf}</td><td>${esc(e.score) || nf}</td></tr>`).join('')}</tbody></table></div>` : `<p>${nf}</p>`}

      <div class="drawer-actions" style="position:static"><button class="btn" id="cvpEdit">Review and correct</button><button class="btn" id="cvpRow">Copy as an Excel row</button><button class="btn" id="cvpRe">${R.reviewedBy ? 'Read the CV again…' : 'Read the CV again'}</button></div><span class="hint" id="cvpMsg"></span></section>`;

      toast('Profile built. Please review it.');
    } catch (e) { toast(e, true); if (btn) busy(btn, false, replace ? 'Read the CV again…' : 'Build the profile from the saved CV'); say(''); }
  };
  const edit = R => {

const FILE_OK = /\.(pdf|docx?|jpe?g|png)$/i;
function fileMime(file) {
  return file.type || ({ pdf: 'application/pdf', doc: 'application/msword', docx: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document', jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png' })[file.name.split('.').pop().toLowerCase()];
}
function readB64(file) {
  return new Promise((resolve, reject) => { const r = new FileReader(); r.onerror = () => reject('Could not read ' + file.name); r.onload = () => resolve(r.result.split(',')[1]); r.readAsDataURL(file); });
}
function checkAttachments(root) {
  for (const inp of $$('.att-input', root)) {
    const f = inp.files[0]; if (!f) continue;
    if (f.size > 10 * 1024 * 1024) return `${f.name} is over 10 MB. Compress it or save it as PDF.`;
    if (!FILE_OK.test(f.name)) return `${f.name}: attach PDF, Word, JPG or PNG.`;
  }
  return '';
}
async function uploadAttachments(entity, id, root) {
  const out = {};
  for (const inp of $$('.att-input', root)) {
    const f = inp.files[0]; if (!f) continue;
    out[inp.dataset.field] = await api('apiUploadDoc', entity, id, inp.dataset.field, f.name, fileMime(f), await readB64(f));
  }
  return out;
}
function bindAttachmentViews(entity, id, root) {
  $$('.att-view', root).forEach(b => b.onclick = () => showFile(`${entity}:${id}:${b.dataset.field}`, () => api('apiGetDoc', entity, id, b.dataset.field), b, 'View', 'Hide'));
}

function uploadCv(id, file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onerror = () => reject('Could not read that file.');
    r.onload = () => {
      const mime = file.type || ({ pdf: 'application/pdf', doc: 'application/msword', docx: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document', jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png' })[file.name.split('.').pop().toLowerCase()];
      api('apiUploadCv', id, file.name, mime, r.result.split(',')[1]).then(resolve, reject);
    };
    r.readAsDataURL(file);
  });
}

const CDN = { pdf: 'https:\/\/cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js', pdfWorker: 'https:\/\/cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',
  mammoth: 'https:\/\/cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js' };
const loaded = {};
function loadScript(src) { return loaded[src] = loaded[src] || new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej('Could not load the viewer. Check the internet connection.'); document.head.appendChild(s); }); }
function b64Bytes(b64) { const bin = atob(b64); const a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a; }

function cvPane() {
  let pane = $('#cvPane');
  if (!pane) {
    document.body.insertAdjacentHTML('beforeend', `<section id="cvPane" class="cv-pane" role="region" aria-label="CV preview" hidden>
      <div class="cv-pane-head"><span class="cv-name"></span><div class="cv-pane-actions"><a class="btn" id="cvDownload">Download</a><button class="btn" id="cvPaneClose">Close</button></div></div>
      <div class="cv-pane-body"></div></section>`);
    pane = $('#cvPane');
    $('#cvPaneClose').onclick = hideCv;
  }
  return pane;
}
function hideCv() {
  const pane = $('#cvPane'); if (!pane || pane.hidden) return;
  pane.hidden = true; $('.cv-pane-body', pane).innerHTML = ''; document.body.classList.remove('cv-open');
  if (pane.dataset.url) { URL.revokeObjectURL(pane.dataset.url); pane.dataset.url = ''; }
  if (pane._btn) { pane._btn.textContent = pane._viewLabel || 'View'; pane._btn = null; }
  pane.dataset.id = '';
}

function showCv(id, btn) { return showFile('cv:' + id, () => api('apiGetCv', id), btn, 'View CV', 'Hide CV'); }

async function showFile(key, fetchFile, btn, viewLabel, hideLabel) {
  const pane = cvPane();
  if (!pane.hidden && pane.dataset.id === key) return hideCv();
  if (!pane.hidden) hideCv();
  busy(btn, true, 'Loading…');
  const id = key;
  try {
    const f = await fetchFile();
    const bytes = b64Bytes(f.b64);
    if (pane.dataset.url) URL.revokeObjectURL(pane.dataset.url);
    const blobUrl = URL.createObjectURL(new Blob([bytes], { type: f.mime }));
    pane.dataset.url = blobUrl; pane.dataset.id = key; pane._btn = btn; pane._viewLabel = viewLabel;
    $('.cv-name', pane).textContent = f.name;
    const dl = $('#cvDownload'); dl.href = blobUrl; dl.setAttribute('download', f.name);
    const body = $('.cv-pane-body', pane);
    body.innerHTML = '<div class="empty">Rendering…</div>';
    pane.hidden = false; document.body.classList.add('cv-open');
    if (/^image[/]/.test(f.mime)) {
      body.innerHTML = `<img class="cv-img" alt="${esc(f.name)}" src="${blobUrl}">`;
    } else if (f.mime === 'application/pdf') {
      await loadScript(CDN.pdf);
      pdfjsLib.GlobalWorkerOptions.workerSrc = CDN.pdfWorker;
      const pdf = await pdfjsLib.getDocument({ data: bytes }).promise;
      body.innerHTML = '';
      const width = Math.min(body.clientWidth - 40, 900);
      for (let n = 1; n <= Math.min(pdf.numPages, 15); n++) {
        const page = await pdf.getPage(n);
        const vp0 = page.getViewport({ scale: 1 });
        const vp = page.getViewport({ scale: (width / vp0.width) * (window.devicePixelRatio || 1) });
        const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height; c.style.width = width + 'px';
        body.appendChild(c);
        await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
      }
      if (pdf.numPages > 15) body.insertAdjacentHTML('beforeend', `<p class="hint">Showing the first 15 of ${pdf.numPages} pages. Download to see the rest.</p>`);
    } else if (/wordprocessingml/.test(f.mime)) {
      await loadScript(CDN.mammoth);
      const out = await mammoth.convertToHtml({ arrayBuffer: bytes.buffer });
      body.innerHTML = `<div class="cv-doc">${out.value}</div>`;
    } else {
      body.innerHTML = '<p class="empty">This file type cannot be previewed here. Use Download.</p>';
    }
    busy(btn, false, hideLabel || 'Hide');
  } catch (e) { toast(e, true); busy(btn, false, viewLabel); }
}

function panelKey(s) { return String(s || '').toLowerCase().replace(/\b(sir|mr|mrs|ms|dr)\b\.?/g, '').replace(/[^a-z]/g, ''); }
function buildPanelIndex() {
  S.panelIndex = {};
  (S.boot.panel || []).forEach(m => [m.name].concat(String(m.aliases || '').split(';')).forEach(a => { const k = panelKey(a); if (k) S.panelIndex[k] = m.name; }));
}
function splitNames(v) { return String(v || '').split(/[\/;,&]| and /i).map(s => s.replace(/\s+/g, ' ').trim()).filter(s => s && !/^(pending|na|hr)$/i.test(s)); }
function linePanel(lineId, field) { const p = lineId && lineById(lineId); return p ? String(p[field] || '') : ''; }
function policyPanel(grade) {
  const g = String(grade || '').toUpperCase();
  if (/^M[12]$/.test(g)) return 'Technical: Head HR, Strategy Team \u00b7 Final: Strategy Team, Director';
  if (g === 'M3') return 'Technical: HOD, BU Head \u00b7 Final: HOD, BU Head, Head HR';
  if (/^M[45]$/.test(g)) return 'Technical: HOD, BU Head, Lead TA \u00b7 Final (if required): HOD, BU Head, Lead TA';
  if (g) return 'Technical: HOD, TA Team \u00b7 Final (if required): HOD, TA Team';
  return 'pick a grade to see the policy panel';
}
function initMulti(root) {
  $$('.ms', root).forEach(el => {
    const hidden = $('input[type=hidden]', el);
    let pref = splitNames(el.dataset.pref).map(n => S.panelIndex[panelKey(n)] || n);
    let sel = [];
    splitNames(hidden.value).forEach(n => { const name = S.panelIndex[panelKey(n)] || n; if (!sel.includes(name)) sel.push(name); });
    const known = n => !!S.panelIndex[panelKey(n)];
    const draw = () => {
      hidden.value = sel.join('; ');
      $('.ms-chips', el).innerHTML = sel.length ? sel.map((n, i) => `<span class="ms-chip ${known(n) ? '' : 'legacy'}" ${known(n) ? '' : 'title="Not in the panel list. Pick the right person or add them."'}>${esc(n)}${el.dataset.ro ? '' : `<button type="button" data-i="${i}" aria-label="Remove ${esc(n)}">\u00d7</button>`}</span>`).join('') : '<span class="att-off">None selected</span>';
      $$('.ms-chips button', el).forEach(b => b.onclick = () => { sel.splice(+b.dataset.i, 1); draw(); });
      const s = $('.ms-add', el); if (!s) return;
      const rest = S.boot.panel.map(m => m.name).filter(n => !sel.includes(n));
      const first = pref.filter(n => rest.includes(n));
      s.innerHTML = '<option value="">Add a panel member\u2026</option>'
        + (first.length ? `<optgroup label="This position\u2019s panel">${first.map(n => `<option>${esc(n)}</option>`).join('')}</optgroup>` : '')
        + `<optgroup label="All panel members">${rest.filter(n => !first.includes(n)).map(n => `<option>${esc(n)}</option>`).join('')}</optgroup>`
        + '<option value="__new">+ New panel member\u2026</option>';
    };
    el._setPref = v => { pref = splitNames(v).map(n => S.panelIndex[panelKey(n)] || n); draw(); };
    el._redraw = draw;
    const s = $('.ms-add', el);
    if (s) s.onchange = () => {
      const v = s.value; s.value = '';
      if (v === '__new') return openPanelDialog(null, m => { if (!sel.includes(m.name)) sel.push(m.name); $$('.ms').forEach(x => x._redraw && x._redraw()); draw(); });
      if (v && !sel.includes(v)) { sel.push(v); draw(); }
    };
    draw();
  });
}

function tatEditor(r, done) {

        ${x.moves.length ? `<ul style="margin:6px 0 0 18px">${x.moves.map(m => `<li>${esc(m.move)}: ${m.n}</li>`).join('')}</ul>` : ''}</div>
        ${x.sample.length ? `<div class="table-wrap" style="margin-top:8px;max-height:260px;overflow:auto"><table><thead><tr><th>Position</th><th>Clock</th><th class="num">Allowed</th><th>Result</th></tr></thead><tbody>
          ${x.sample.map(c => `<tr style="cursor:default"><td>${esc(c.mrf)} ${esc(c.position)}<span class="sub">${esc(c.grade)} \u00b7 ${esc(c.recruiter)} \u00b7 ${esc(c.status)}</span></td><td>${esc(c.clock)}</td><td class="num">${c.allowedBefore} \u2192 ${c.allowedAfter}</td><td>${esc(c.before || '\u2014')}${c.before !== c.after ? ` \u2192 <b>${esc(c.after || '\u2014')}</b>` : ''}</td></tr>`).join('')}</tbody></table></div>` : ''}`;
      $('#tatSave', b).disabled = false;
    } catch (e) { toast(e, true); }
    busy(btn, false, 'Preview impact');
  };
  $('#tatSave', b).onclick = async () => {
    const btn = $('#tatSave', b); busy(btn, true, 'Saving\u2026');
    try {
      const x = await api('apiTatSave', payload());
      try { S.boot = await api('apiBootstrap'); } catch (e) { }

  };

}

const JDM_SHEETS = ['JD_Register', 'KRA_Library', 'Skills_Library', 'Competency_Skills', 'Competency_Requirements', 'Grade_Master', 'Qualification_Norms', 'Grade_Standard_KRAs', 'KRA_Categories', 'Review_Log'];
const JDM_REQUIRED = JDM_SHEETS.slice(0, 9);
function jdmTick(on, title) { return on ? `<span class="ok-tick" title="${esc(title || 'Confirmed')}">\u2713</span>` : ''; }
function jdmProg(done, total) { const p = total ? Math.round(100 * done / total) : 0; return `<div class="jdm-prog" role="progressbar" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100"><div style="width:${p}%"></div></div>`; }
function twoStep(btn, label, run) {
  btn.onclick = async () => {
    if (!btn.dataset.armed) { btn.dataset.armed = '1'; const old = btn.textContent; btn.textContent = label; setTimeout(() => { if (btn.dataset.armed) { delete btn.dataset.armed; btn.textContent = old; } }, 5000); return; }
    delete btn.dataset.armed; await run();
  };
}
async function viewJdm(v) {

function jdmImportDialog(done) {
  const b = openDrawer('Import the JD library', `<p>Choose the <b>BFCL Master JD Library</b> workbook (.xlsx). The file is read in your browser; nothing changes until you confirm.</p>
    <div class="field"><label for="jdmFile">Workbook</label><input type="file" id="jdmFile" accept=".xlsx"></div>
    <div id="jdmCheck"></div>
    <p class="hint">On an update, grades, departments and duplicate decisions already signed off, and responsibilities added or edited in the app, are kept.</p>
    <div class="drawer-actions"><button class="btn" id="jdmCancel">Cancel</button><button class="btn primary" id="jdmGo" disabled>Import</button></div>`);
  let parsed = null, fileName = '';
  $('#jdmCancel', b).onclick = closeDrawer;
  $('#jdmFile', b).onchange = async e => {
    const file = e.target.files[0]; parsed = null; $('#jdmGo', b).disabled = true;
    if (!file) return;
    fileName = file.name;
    $('#jdmCheck', b).innerHTML = '<p class="hint">Reading the workbook\u2026</p>';
    try {
      await loadScript(CDN_NPM + 'xlsx@0.18.5/dist/xlsx.full.min.js');
      const wb = XLSX.read(new Uint8Array(await file.arrayBuffer()), { type: 'array' });
      const miss = JDM_REQUIRED.filter(n => !wb.SheetNames.includes(n));
      if (miss.length) { $('#jdmCheck', b).innerHTML = `<div class="note warn-note">This is not the BFCL Master JD Library: missing sheet${miss.length > 1 ? 's' : ''} ${esc(miss.join(', '))}.</div>`; return; }
      parsed = { names: wb.SheetNames, sheets: {} };
      JDM_SHEETS.forEach(n => { if (wb.Sheets[n]) parsed.sheets[n] = XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: '' }); });
      $('#jdmCheck', b).innerHTML = `<div class="table-wrap"><table><thead><tr><th>Sheet</th><th class="num">Rows</th></tr></thead><tbody>
        ${JDM_SHEETS.filter(n => parsed.sheets[n]).map(n => `<tr style="cursor:default"><td>${esc(n)}</td><td class="num">${Math.max(0, parsed.sheets[n].length - 1).toLocaleString('en-IN')}</td></tr>`).join('')}</tbody></table></div>`;
      $('#jdmGo', b).disabled = false;
    } catch (err) { $('#jdmCheck', b).innerHTML = `<div class="note warn-note">Could not read the file: ${esc(err.message || err)}</div>`; }
  };
  $('#jdmGo', b).onclick = async () => {
    if (!parsed) return;
    const btn = $('#jdmGo', b); busy(btn, true, 'Importing\u2026'); $('#jdmCancel', b).disabled = true;
    const say = t => { $('#jdmCheck', b).innerHTML = `<p class="hint">${esc(t)}</p>`; };
    try {
      const st = await api('apiJdmImportStart', { fileName, sheets: parsed.names });
      for (const n of JDM_SHEETS) {
        const rows = parsed.sheets[n]; if (!rows || !rows.length) continue;
        const head = rows[0], body = rows.slice(1);
        for (let i = 0; i < Math.max(body.length, 1); i += 1500) { say(`Sending ${n}\u2026 ${Math.min(i + 1500, body.length).toLocaleString('en-IN')} of ${body.length.toLocaleString('en-IN')}`); await api('apiJdmImportPart', st.token, n, head, body.slice(i, i + 1500)); }
      }
      say('Checking and saving\u2026');
      const r = await api('apiJdmImportFinish', st.token);
      if (!r.ok) {
        $('#jdmCheck', b).innerHTML = `<div class="note warn-note"><b>Nothing was changed.</b> Fix these in the workbook and import again:<ul style="margin:6px 0 0 18px">${r.errors.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`;
        busy(btn, false, 'Import'); $('#jdmCancel', b).disabled = false; return;
      }
      $('#jdmCheck', b).innerHTML = `<div class="note"><b>Imported as library version L${r.version}.</b> ${r.counts.templates} job profiles, ${r.counts.statements.toLocaleString('en-IN')} responsibilities, ${r.counts.skills.toLocaleString('en-IN')} skills, ${r.counts.competencies} competencies in ${r.counts.compDepts} departments.
        ${r.carried.templates || r.carried.statements || r.carried.added ? `<div style="margin-top:4px">Kept from the earlier version: ${r.carried.templates} signed-off or edited profiles, ${r.carried.statements} edited and ${r.carried.added} added items.</div>` : ''}
        ${r.deptMap && r.deptMap.added ? `<div style="margin-top:4px">${r.deptMap.added} CRM departments added to the department map.</div>` : ''}
        ${r.warnings.length ? `<div style="margin-top:6px"><b>Warnings:</b><ul style="margin:4px 0 0 18px">${r.warnings.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}</div>`;
      btn.hidden = true; $('#jdmCancel', b).disabled = false; $('#jdmCancel', b).textContent = 'Close';
      $('#jdmCancel', b).onclick = () => { closeDrawer(); done(); };
    } catch (err) { toast(err, true); busy(btn, false, 'Import'); $('#jdmCancel', b).disabled = false; }
  };
}

function jmWorkFromDraft(dr) {

    id: 'g' + gi, name: g.cat, baseName: g.cat, changeType: '', active: true,

function jmPayload(w) {

  w.groups.forEach(g => {
    if (g.active && !g.baseName) p.addedCategories.push({ name: g.name });
    if (g.active && g.baseName && g.name !== g.baseName) p.modifiedCategories.push({ id: g.baseName, name: g.name });
    g.items.forEach(it => {
      const row = { id: it.id, text: it.text, category: g.name, seq: seq++ };
      if (!it.active && it.id) p.deletedResponsibilities.push(row);
      else if (it.active && !it.id) p.addedResponsibilities.push(row);
      else if (it.active && it.id && (it.text !== it.baseText || g.name !== it.baseCategory)) p.modifiedResponsibilities.push(row);
      else if (it.active && it.id && (row.seq !== it.baseSeq || g.name !== it.baseCategory)) p.reorderedResponsibilities.push(row);
    });
  });

}

}

async function jdmDepts(el, f) {

function userDrawer(r, x, done) {

        return;

  };
  $('#usSave', b).onclick = () => save('');
}

const KPI_NOTES = {
  OFFER_BACKOUT: 'Backouts ÷ offers made in the month · lower is better · not scored',
  PSYCHOMETRIC: 'Shortlisted Manager+ candidates without a test · 5 for 0, 3 for 1, 0 for more',
  MRF_ADHERENCE: 'Observations logged in the month · 5 for 0, down to 0 for more than 4',
  BGV: 'Manager+ or flagged hires without BGV on time · 5 for 0, 2 for 1, 0 for more',
  TRACKER_ACCURACY: 'Errors in the monthly 20% audit · 5 for 0 errors, 0 for any'
};
function fyNow() { const d = new Date(); return d.getMonth() >= 3 ? d.getFullYear() : d.getFullYear() - 1; }
function monthLabel(m) { const [y, mm] = m.split('-'); return `${MONTHS[mm - 1]} ${y.slice(2)}`; }
function scoreBadge(s) { return s == null ? '' : `<span class="score s${s}">${s}</span>`; }

async function viewKpi(v, fresh) {
  const f = S.kpiFilter = S.kpiFilter || { fy: fyNow(), rec: isLead() ? 'TEAM_TOTAL' : S.boot.user.recruiter };
  const k = await api('apiKpi', f.fy, !!fresh);
  const recs = Object.keys(k.data).filter(r => r !== 'TEAM_TOTAL').sort();
  const d = k.data[f.rec] || {};
  const tgt = kpi => {
    const who = f.rec === 'TEAM_TOTAL' ? '*' : f.rec.toLowerCase();
    const rows = k.targets.filter(t => t.kpi === kpi && (t.recruiter === who || t.recruiter === '*')).sort((a, b) => (a.recruiter === '*') - (b.recruiter === '*') || (a.from < b.from ? 1 : -1));
    const t = rows[0]; if (!t) return '';
    return `${t.days} days · ${String(t.levels || 'All')} levels${t.exempt ? ' · notice beyond 30 days exempt' : ''}${t.recruiter === '*' && f.rec !== 'TEAM_TOTAL' ? ' · team default' : ''}`;
  };
  const cellHtml = (kpi, m) => {
    const c = d[kpi] && d[kpi][m];
    if (!c) return '<td class="kcell empty-cell">–</td>';
    if (k.defs[kpi].count) {
      if (kpi === 'TRACKER_ACCURACY' && c.pending) return `<td class="kcell" data-k="${kpi}" data-m="${m}" tabindex="0"><b>${c.num}</b><span class="frac">${c.pending} to check</span></td>`;
      return `<td class="kcell" data-k="${kpi}" data-m="${m}" tabindex="0"><b>${c.num}</b><span class="frac">${esc(k.defs[kpi].unit)}</span>${scoreBadge(c.score)}</td>`;
    }
    return `<td class="kcell" data-k="${kpi}" data-m="${m}" tabindex="0"><b>${c.pct}%</b><span class="frac">${c.num}/${c.den}</span>${scoreBadge(c.score)}</td>`;
  };
  v.innerHTML = `
    <div class="page-head"><div><h1>KPI scorecard</h1>

  $('#kpiRefresh').onclick = async () => { const b = $('#kpiRefresh'); busy(b, true, 'Recalculating…'); try { await viewKpi(v, true); toast('KPIs recalculated'); } catch (e) { toast(e, true); busy(b, false, 'Recalculate'); } };

function kpiDrill(k, f, kpi, m) {
  const c = k.data[f.rec][kpi][m];
  const team = f.rec === 'TEAM_TOTAL';
  const who = team ? 'Whole team' : f.rec;
  let head, rows;
  const recCol = i => team ? `<td>${esc(i.recruiter)}</td>` : '';
  const recHead = team ? '<th>Recruiter</th>' : '';
  if (kpi === 'PSYCHOMETRIC') {
    head = `<th>Candidate</th>${recHead}<th>Shortlisted</th><th>Test</th>`;
    rows = c.items.sort((a, b) => a.ok - b.ok).map(i => `<tr><td>${esc(i.name)}<span class="sub">${esc(i.id)} · ${esc(i.position)}</span></td>${recCol(i)}<td class="nw">${fmtDate(i.date)}</td><td>${i.ok ? `<span class="ok">${esc(i.status)}</span>` : `<span class="miss">${esc(i.status)}</span>`}</td></tr>`);
  } else if (kpi === 'BGV') {
    head = `<th>Position</th>${recHead}<th>Offer / joined</th><th>BGV</th><th>Result</th>`;
    rows = c.items.sort((a, b) => a.ok - b.ok).map(i => `<tr><td>${esc(i.position)}<span class="sub">${esc(i.mrf)} · ${esc(i.grade)}</span></td>${recCol(i)}<td class="nw">${fmtDate(i.offer) || '—'}<span class="sub">joined ${fmtDate(i.doj)}</span></td><td class="nw">Prev: ${fmtDate(i.prev) || '—'}<span class="sub">Current: ${fmtDate(i.curr) || '—'}</span></td><td>${i.ok ? `<span class="ok">OK</span>${i.why ? `<span class="sub">${esc(i.why)}</span>` : ''}` : `<span class="miss">${esc(i.why)}</span>`}</td></tr>`);
  } else if (kpi === 'MRF_ADHERENCE') {
    head = `<th>Date</th>${recHead}<th>Observation</th><th>Status</th>`;
    rows = c.items.map(i => `<tr><td class="nw">${fmtDate(i.date)}</td>${recCol(i)}<td>${esc(i.type)}<span class="sub">${esc(i.mrf ? i.mrf + ' · ' : '')}${esc(i.description)}</span></td><td>${esc(i.status)}</td></tr>`);
  } else if (kpi === 'TRACKER_ACCURACY') {
    head = `<th>Record</th>${recHead}<th>Result</th>`;
    rows = c.items.sort((a, b) => (a.result === 'Error' ? -1 : 1)).map(i => `<tr><td>${esc(i.label)}<span class="sub">${esc(i.entity)} · ${esc(i.record)}</span></td>${recCol(i)}<td>${i.result === 'Error' ? `<span class="miss">Error: ${esc(i.field)}${i.critical ? ' (critical)' : ''}</span>` : esc(i.result)}${i.remarks ? `<span class="sub">${esc(i.remarks)}</span>` : ''}</td></tr>`);
  } else if (kpi === 'OFFER_BACKOUT') {
    head = `<th>Event</th><th>Date</th><th>Position</th>${team ? '<th>Recruiter</th>' : ''}`;
    rows = c.items.sort((a, b) => a.date < b.date ? -1 : 1).map(i => `<tr><td>${i.event === 'Backout' ? '<b>Backout</b>' : 'Offer'}</td><td class="nw">${fmtDate(i.date)}</td><td>${esc(i.position)}<span class="sub">${esc(i.mrf)} · ${esc(i.grade)}</span></td>${team ? `<td>${esc(i.recruiter)}</td>` : ''}</tr>`);
  } else {
    const due = kpi === 'M_FULFILMENT';
    head = `<th>Position</th>${team ? '<th>Recruiter</th>' : ''}<th>MRF date</th><th>${due ? 'Due by' : 'Joined'}</th><th class="num">${due ? 'Allowed' : 'Days'}</th><th>Result</th>`;
    rows = c.items.sort((a, b) => a.ok - b.ok).map(i => `<tr><td>${esc(i.position)}<span class="sub">${esc(i.mrf)} · ${esc(i.grade)}</span></td>${team ? `<td>${esc(i.recruiter)}</td>` : ''}
      <td class="nw">${fmtDate(i.receipt)}</td><td class="nw">${fmtDate(due ? i.due : i.doj)}${due && i.doj ? `<span class="sub">joined ${fmtDate(i.doj)}</span>` : ''}</td>
      <td class="num">${due ? i.allowed : `${i.days} / ${i.allowed}`}${i.extra || i.hold || i.paused ? `<span class="sub" title="${esc(i.reasons || '')}">${[i.extra ? '+' + i.extra + ' d exemption' : '', i.hold ? i.hold + ' d on hold' : '', i.paused ? i.paused + ' d paused' : ''].filter(Boolean).join(' \u00b7 ')}</span>` : ''}</td><td>${i.ok ? '<span class="ok">Within TAT</span>' : `<span class="miss">${due && !i.doj ? 'Not filled (' + esc(i.status) + ')' : 'Missed'}</span>`}</td></tr>`);
  }
  openDrawer(`${k.defs[kpi].name} · ${monthLabel(m)}`, `
    <div class="readout" style="margin-top:12px"><div>${esc(who)}<b>${k.defs[kpi].count ? c.num + ' ' + esc(k.defs[kpi].unit) : c.pct + '%'}</b></div><div>${k.defs[kpi].count ? 'Checked' : kpi === 'OFFER_BACKOUT' ? 'Backouts / offers' : 'Within TAT / counted'}<b>${k.defs[kpi].count ? c.den : c.num + ' / ' + c.den}</b></div><div>Score<b>${c.score == null ? '—' : c.score + ' / 5'}</b></div></div>
    ${c.items.length ? '' : '<p class="empty">Nothing to count this month.</p>'}
    <div class="table-wrap" style="margin-top:14px"><table><thead><tr>${head}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`);
}

const OBS_TYPES = ['Hiring started before MRF approval', 'MRF incomplete (JD / KRA / budget / grade)', 'Candidate evaluation form missing',
  'Interview panel not as per policy matrix', 'Offer issued without required approval', 'Other'];
function thisMonth() { return today().slice(0, 7); }
function lastMonth() { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - 1); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 7); }

function obDrawer(r, after) {
  const lines = S.positions.filter(p => p.Position_Status !== 'Removed').sort((a, b) => String(b.Receipt_Date).localeCompare(String(a.Receipt_Date))).map(p => [p.Line_ID, lineLabel(p) + ' \u00b7 ' + p.Recruiter]);
  const data = r || { Obs_Date: today(), Status: 'Open' };
  const fields = [{ k: 'Obs_Date', l: 'Date', t: 'date', req: true }, { k: 'Status', l: 'Status', t: 'select', opts: ['Open', 'Closed'], noBlank: true },
    { k: 'Type', l: 'Observation', t: 'select', opts: OBS_TYPES, req: true, wide: true },
    { k: 'Line_ID', l: 'Position (optional)', t: 'select', opts: lines, wide: true, hint: 'Linking a position fills in the recruiter.' },
    { k: 'Recruiter', l: 'Recruiter', t: 'select', opts: S.boot.recruiters },
    { k: 'Description', l: 'Details', t: 'textarea', wide: true }];
  const b = openDrawer(r ? 'Edit observation' : 'Log observation', `<div id="obForm">${wrapForm(form(fields, data))}</div>
    <div class="drawer-actions"><button class="btn" id="obCancel">Cancel</button><button class="btn primary" id="obSave">Save</button></div>`);
  $('#f_Line_ID', b).onchange = e => { const p = lineById(e.target.value); if (p) $('#f_Recruiter', b).value = String(p.Recruiter).trim(); };
  $('#obCancel').onclick = closeDrawer;
  $('#obSave').onclick = async () => {
    const btn = $('#obSave'); busy(btn, true, 'Saving\u2026');
    try { await api('apiSaveObservation', Object.assign({ Obs_ID: r ? r.Obs_ID : '' }, readForm($('#obForm')))); toast('Observation saved'); closeDrawer(); after(); }
    catch (e) { toast(e, true); busy(btn, false, 'Save'); }
  };
}

async function renderAudit(el, f) {
  el.innerHTML = `
    <div class="filters">
      <div class="field"><label for="aum">Audit month</label><input id="aum" type="month" value="${esc(f.auditMonth)}" max="${thisMonth()}"></div>
      <div style="flex:1"></div>${isLead() ? '<button class="btn primary" id="auGen">Create 20% sample</button>' : ''}
    </div>
    <p class="legend" style="margin-top:0">The sample is a random 20% of the positions and candidates the team added or edited in that month. Mark each record Correct or Error after checking it against the source documents. Any error in the MRF date or closing/joining date is marked critical.</p>
    <div id="auList">${skRows(6, 5)}</div>`;
  const load = async () => {
    const rows = await api('apiAuditList', f.auditMonth);
    if (!rows.length) { $('#auList').innerHTML = `<div class="empty">No audit sample for ${esc(monthLabel(f.auditMonth))} yet.${isLead() ? ' Create one with the button above.' : ''}</div>`; return; }
    const done = rows.filter(r => r.Result !== 'Pending').length, errs = rows.filter(r => r.Result === 'Error').length;
    $('#auList').innerHTML = `<p style="margin:0 0 10px;color:var(--ink-2)">${done} of ${rows.length} checked \u00b7 ${errs} error${errs === 1 ? '' : 's'}</p>
      <div class="table-wrap"><table><thead><tr><th>Record</th><th>Recruiter</th><th>Result</th><th>Wrong field</th><th>Remarks</th><th></th></tr></thead><tbody>
      ${rows.map(r => `<tr data-id="${esc(r.Audit_ID)}" style="cursor:default"><td>${esc(r.Label)}<span class="sub">${esc(r.Entity)} \u00b7 <button class="linklike" data-open="${esc(r.Entity)}|${esc(r.Record_ID)}">${esc(r.Record_ID)}</button></span></td><td>${esc(r.Recruiter)}</td>
        <td><select data-f="Result" ${isLead() ? '' : 'disabled'}>${opts(['Pending', 'Correct', 'Error'], r.Result, false)}</select></td>
        <td><input data-f="Error_Field" value="${esc(r.Error_Field)}" placeholder="e.g. MRF date" ${isLead() ? '' : 'disabled'}></td>
        <td><input data-f="Remarks" value="${esc(r.Remarks)}" ${isLead() ? '' : 'disabled'}></td>
        <td>${isLead() ? '<button class="btn au-save">Save</button>' : ''}${r.Critical === 'Yes' ? '<span class="sub miss">critical</span>' : ''}</td></tr>`).join('')}
      </tbody></table></div>`;
    $$('#auList [data-open]').forEach(b => b.onclick = async e => {
      e.stopPropagation(); const [ent, id] = b.dataset.open.split('|');
      if (ent === 'Candidate') openCandidate(id); else { await loadPositions(); positionDrawer(lineById(id)); }
    });
    $$('#auList .au-save').forEach(b => b.onclick = async () => {
      const tr = b.closest('tr'); const d = { Audit_ID: tr.dataset.id };
      $$('[data-f]', tr).forEach(x => d[x.dataset.f] = x.value);
      busy(b, true, 'Saving\u2026');
      try { await api('apiAuditSave', d); toast('Audit result saved'); load(); } catch (e) { toast(e, true); busy(b, false, 'Save'); }
    });
  };
  $('#aum').onchange = e => { f.auditMonth = e.target.value; load(); };
  if ($('#auGen')) $('#auGen').onclick = async () => {
    const b = $('#auGen'); busy(b, true, 'Creating\u2026');
    try { const r = await api('apiAuditGenerate', f.auditMonth); toast(`Sampled ${r.sampled} of ${r.population} records`); load(); } catch (e) { toast(e, true); } finally { busy(b, false, 'Create 20% sample'); }
  };
  load();
}

function dayWorkHtml(r) {
  const items = r.work.map(w => `<li><b>${w.count}</b> ${esc(w.label.toLowerCase())}</li>`);
  const mv = Object.entries(r.moves || {});
  if (mv.length) items.push(`<li>Candidate moves: ${mv.map(([k, n]) => `${n} \u2192 ${esc(MOVE_LABELS[k] || k)}`).join(', ')}</li>`);
  if (r.offers.length) items.push(`<li>Offers dated this day: ${r.offers.map(o => esc(o.position)).join(', ')}</li>`);
  if (r.joined.length) items.push(`<li>Joined: ${r.joined.map(o => esc(o.position)).join(', ')}</li>`);
  if (r.backouts) items.push(`<li class="miss">${r.backouts} backout${r.backouts > 1 ? 's' : ''}</li>`);
  return items.length ? `<ul class="work">${items.join('')}</ul>` : '<p class="hint">Nothing recorded in the app for this day.</p>';
}

      ${editable ? `<h3 style="margin:18px 0 8px;font-size:16px">Log activity for a position</h3><div id="mdLog"><p class="hint">Loading positions\u2026</p></div>` : ''}
    </section>`;

  bindDayPositions($('#mdPos'), r.byPosition, { rec: me, date: editable ? f.date : '', list: r.dayStatusList }, () => go('myday', false));

  let timer, saving = Promise.resolve();
  const state = t => { const el = $('#mdState'); if (el) el.textContent = t; };
  const save = () => {
    clearTimeout(timer);
    state('Saving\u2026');
    saving = saving.then(() => api('apiSaveDaySummary', { date: f.date, overview: $('#mdNote').value, tasks }))
      .then(res => state('Saved at ' + res.savedAt)).catch(e => { state('Not saved'); toast(e, true); });
  };

    const el = $('#mdEntries'); if (!el) return;
    el.innerHTML = rows.length ? funnelTable(rows, true) + '<p class="hint">Entries can be edited until midnight on the day they are saved.</p>' : '<p class="hint">You have not logged any activity for this day yet.</p>';

  $('#mdNote').addEventListener('blur', () => { if (timer) save(); });
  const add = () => { const inp = $('#mdNewTask'); const t = inp.value.trim(); if (!t) return; tasks.push({ t, d: false }); inp.value = ''; drawTasks(); save(); };
  $('#mdAdd').onclick = add;

  await loadPositions();
  $('#mdLog').innerHTML = dailyFormHtml(null, { Entry_Date: f.date });
  bindDailyForm($('#mdLog'), () => { toast('Activity logged'); go('myday', false); });
}

const P_STAGES = ['Sourced', 'Screened', 'Shared', 'Confirmed', 'Technical', 'HR', 'Docs', 'Offer', 'Prejoin', 'Joined', 'Onboarded'];
const P_NAMES = { Sourced: 'CV received', Screened: 'Screened', Shared: 'Shared with dept', Confirmed: 'Dept confirmed', Technical: 'Technical interview',
  HR: 'HR interview', Docs: 'Documents verified', Offer: 'Offer released', Prejoin: 'Pre-joining', Joined: 'Joined', Onboarded: 'Onboarded' };
const MOVE_LABELS = Object.assign({}, P_NAMES, { Rejected: 'rejected', 'On hold': 'on hold', Withdrawn: 'withdrawn', Backout: 'backout', Active: 'reactivated' });
const DOC_STATES = ['Pending', 'Received', 'Verified', 'NA'];

/* Overview pipeline alerts: three boxes with the first few items; the title or "View all" opens the full list. */
const ALERT_TABS = [['hod', 'hodOverdue', OV_ALERTS[0]], ['risk', 'atRisk', OV_ALERTS[1]], ['due', 'dueToday', OV_ALERTS[2]]];
function alertAge(n) { return n == null ? '' : n === 0 ? 'today' : n > 0 ? n + ' day' + (n === 1 ? '' : 's') + ' ago' : 'in ' + (-n) + ' day' + (n === -1 ? '' : 's'); }
function alertWait(h) { return h < 48 ? h + ' h' : Math.floor(h / 24) + ' d ' + (h % 24) + ' h'; }
function openAlertCard(x) { S.pipe = Object.assign(S.pipe || {}, { line: x.line, openApp: x.app }); go('pipeline', true); }
async function pipelineAlertsPanel(host, pending) {
  if (!host) return;
  try {
    const a = await pending;
    if (!host.isConnected) return;
    const short = {
      hod: x => ` · ${esc(x.dept)} · waiting <b>${alertWait(x.hours)}</b>`,
      risk: x => ` · <span class="risk r-${esc(x.level)}">${esc(x.level)}</span> <span class="sub">${esc(x.why[0])}</span>`,
      due: x => ` · ${esc(x.recruiter)} · ${x.missing ? (x.fuCount ? 'no next check-in' : 'never checked in') : 'due ' + fmtDate(x.next)}`
    };
    const box = ([k, key, title], cls) => {
      const list = a[key] || [];
      const note = k === 'risk' && a.unassessed ? `<p class="hint">${a.unassessed} joiner${a.unassessed === 1 ? ' has' : 's have'} never been checked on, so their risk is not known. <button class="linklike" data-all="due">See follow-ups</button></p>` : '';
      return `<section class="panel palert ${list.length ? cls : ''}"><h2><button class="linklike palert-t" data-all="${k}">${title}</button> <span class="pcount">${list.length}</span></h2>
        ${list.length ? `<ul class="work">${list.slice(0, 5).map((x, i) => `<li><button class="linklike" data-k="${k}" data-i="${i}">${esc(x.name)}</button> · ${esc(x.position)}${short[k](x)}</li>`).join('')}</ul>` : '<p class="hint">None.</p>'}
        ${note}${list.length ? `<button class="btn sm palert-all" data-all="${k}">View all ${list.length}${list.length > 5 ? '' : ' with details'}</button>` : ''}</section>`;
    };
    host.innerHTML = `<div class="palerts">${box(ALERT_TABS[0], 'warn')}${box(ALERT_TABS[1], 'bad')}${box(ALERT_TABS[2], 'warn')}</div>`;
    $$('[data-all]', host).forEach(b => b.onclick = () => alertsDialog(a, b.dataset.all));
    $$('[data-k]', host).forEach(b => b.onclick = () => openAlertCard(a[ALERT_TABS.find(t => t[0] === b.dataset.k)[1]][+b.dataset.i]));
  } catch (e) { host.innerHTML = ''; }
}
/** Full pop-up of the pipeline alerts: every item with what is pending and since when; filter, open the card, export. */
function alertsDialog(a, tab) {
  let d = $('#alertsDlg');
  if (!d) { document.body.insertAdjacentHTML('beforeend', '<dialog id="alertsDlg" class="pm-dialog alerts-dlg" aria-labelledby="alTitle"></dialog>'); d = $('#alertsDlg'); }
  const f = { tab: tab || 'due', rec: '', q: '' };
  const lastTxt = x => x.last ? `${fmtDate(x.last.date)} · ${x.last.mode}${x.last.risk ? ' · ' + x.last.risk : ''}${x.last.response ? ' · ' + x.last.response : ''}${x.last.note ? ' · ' + x.last.note : ''}` : 'None recorded';
  const joinTxt = x => x.edoj ? `${fmtDate(x.edoj)} (${alertAge(-x.edojIn)})` : 'Not set';
  const cand = x => `<button class="linklike" data-open="${esc(x.app)}"><b>${esc(x.name)}</b></button><span class="sub">${esc(x.cand)}${x.mobile ? ' · ' + esc(x.mobile) : ''}</span>`;
  const pos = x => `${esc(x.position)}<span class="sub">${esc(x.mrf)} · ${esc(x.grade)} · ${esc(x.dept)}</span>`;
  const stage = x => `${esc(x.stageName)}<span class="sub">since ${x.since ? fmtDate(x.since) + ' (' + alertAge(x.daysInStage) + ')' : '—'}</span>`;
  const last = x => `${esc(lastTxt(x))}${x.last && x.last.by ? `<span class="sub">by ${esc(x.last.by)} · ${x.fuCount} check-in${x.fuCount === 1 ? '' : 's'} in all</span>` : ''}`;
  const COLS = {
    due: [['Candidate', cand, x => x.name + ' ' + x.mobile], ['Position', pos, x => x.position + ' ' + x.mrf + ' ' + x.dept], ['Recruiter', x => esc(x.recruiter), x => x.recruiter],
      ['Stage', stage, x => x.stageName + ' since ' + x.since], ['Offer / accepted', x => `${x.offer ? fmtDate(x.offer) : '—'}<span class="sub">${x.accepted ? 'accepted ' + fmtDate(x.accepted) : 'not accepted yet'}</span>`, x => x.offer + ' / ' + (x.accepted || 'not accepted')],
      ['Expected joining', x => esc(joinTxt(x)), joinTxt], ['Last check-in', last, lastTxt],
      ['What is pending', x => `<b class="${x.waitDays > 3 ? 'miss' : ''}">${esc(x.pending)}</b>${x.waitDays != null ? `<span class="sub">pending ${x.waitDays} day${x.waitDays === 1 ? '' : 's'}</span>` : ''}`, x => x.pending]],
    risk: [['Candidate', cand, x => x.name + ' ' + x.mobile], ['Position', pos, x => x.position + ' ' + x.mrf + ' ' + x.dept], ['Recruiter', x => esc(x.recruiter), x => x.recruiter],
      ['Risk', x => `<span class="risk r-${esc(x.level)}">${esc(x.level)}</span>`, x => x.level], ['Why', x => `<ul class="work">${x.why.map(w => `<li>${esc(w)}</li>`).join('')}</ul>`, x => x.why.join('; ')],
      ['Stage', stage, x => x.stageName + ' since ' + x.since], ['Expected joining', x => esc(joinTxt(x)), joinTxt], ['Last check-in', last, lastTxt],
      ['Next check-in', x => x.next ? fmtDate(x.next) : '<span class="miss">None scheduled</span>', x => x.next || 'None scheduled']],
    hod: [['Candidate', cand, x => x.name + ' ' + x.mobile], ['Position', pos, x => x.position + ' ' + x.mrf], ['Department / HOD', x => `${esc(x.dept)}<span class="sub">${esc(x.hod || 'HOD not set')}${x.hodEmail ? ' · ' + esc(x.hodEmail) : ''}</span>`, x => x.dept + ' / ' + (x.hod || 'HOD not set')],
      ['Recruiter', x => esc(x.recruiter), x => x.recruiter], ['Shared on', x => x.since ? fmtDate(x.since) : '—', x => x.since],
      ['Waiting', x => `<b class="${x.hours >= 72 ? 'miss' : ''}">${alertWait(x.hours)}</b>`, x => alertWait(x.hours)], ['What is pending', x => esc(x.pending), x => x.pending]]
  };
  const listOf = k => a[ALERT_TABS.find(t => t[0] === k)[1]] || [];
  const recs = [...new Set([].concat(...ALERT_TABS.map(t => (a[t[1]] || []).map(x => x.recruiter))))].sort();
  const rows = () => listOf(f.tab).filter(x => (!f.rec || x.recruiter === f.rec) && (!f.q || COLS[f.tab].map(c => c[2](x)).join(' ').toLowerCase().includes(f.q)));
  const summary = list => {
    if (f.tab === 'due') {
      const n = fn => list.filter(fn).length, oldest = Math.max(0, ...list.map(x => x.waitDays || 0));
      const parts = [[n(x => !x.next && !x.fuCount), 'never checked in', 1], [n(x => !x.next && x.fuCount), 'no next check-in scheduled'],
        [n(x => x.next && x.next < a.today), 'check-in overdue', 1], [n(x => x.next === a.today), 'due today']].filter(p => p[0]);
      return `${list.length} due${parts.map(([c, t, bad]) => ` \u00b7 ${bad ? '<b class="miss">' : ''}${c} ${t}${bad ? '</b>' : ''}`).join('')}${list.length ? ' \u00b7 longest pending ' + oldest + ' days' : ''}`;
    }
    if (f.tab === 'risk') { const red = list.filter(x => x.level === 'Red').length;
      return `${list.length} at risk · <b class="miss">${red} Red</b> · ${list.length - red} Amber${a.unassessed ? ` · ${a.unassessed} joiners never checked on (risk not known)` : ''}`; }
    const long = list.filter(x => x.hours >= 72).length;
    return `${list.length} waiting · <b class="miss">${long} over 3 days</b>${list.length ? ' · longest ' + alertWait(Math.max(...list.map(x => x.hours))) : ''}`;
  };
  const draw = () => {
    const list = rows(), cols = COLS[f.tab];
    d.innerHTML = `<div class="al-head"><h2 id="alTitle">Pipeline alerts</h2><button class="icon-btn" data-close aria-label="Close">✕</button></div>
      <div class="chips" role="tablist">${ALERT_TABS.map(([k, key, t]) => `<button class="chip" role="tab" aria-selected="${f.tab === k}" aria-pressed="${f.tab === k}" data-tab="${k}">${t}<span class="n">${(a[key] || []).length}</span></button>`).join('')}</div>
      <div class="filters">${isLead() ? `<div class="field"><label for="alRec">Recruiter</label><select id="alRec">${opts(recs, f.rec)}</select></div>` : ''}
        <div class="field search"><label for="alQ">Search</label><input id="alQ" type="search" value="${esc(f.q)}" placeholder="Candidate, position, MRF, department"></div></div>
      <p class="al-sum">${summary(list)}</p>
      <div class="al-body">${list.length ? `<div class="table-wrap"><table><thead><tr>${cols.map(c => `<th>${c[0]}</th>`).join('')}<th></th></tr></thead><tbody>
        ${list.map(x => `<tr style="cursor:default">${cols.map(c => `<td>${c[1](x)}</td>`).join('')}<td><button class="btn sm" data-open="${esc(x.app)}">Open card</button></td></tr>`).join('')}</tbody></table></div>`

function orgImportDialog(done) {
  const b = openDrawer('Import the manpower report', `<p>Choose the <b>Approved vs Existing Manpower</b> report (.xlsx). It is read in your browser and checked first. Nothing changes until you confirm, and the import replaces the earlier headcount snapshot.</p>
    <div class="field"><label for="orgFile">Report</label><input type="file" id="orgFile" accept=".xlsx"></div>
    <div class="field" style="max-width:200px"><label for="orgAsOn">Headcount as on</label><input type="date" id="orgAsOn" value="${today()}" max="${today()}"></div>
    <div id="orgCheck"></div>
    <div class="drawer-actions"><button class="btn" id="orgCancel">Cancel</button><button class="btn primary" id="orgGo" disabled>Import</button></div>`);
  let rows = null, fileName = '';
  $('#orgCancel', b).onclick = closeDrawer;
  const show = r => {
    const errs = r.errors && r.errors.length ? `<div class="note warn-note"><b>Nothing was changed.</b> Fix these and choose the file again:<ul style="margin:6px 0 0 18px">${r.errors.map(x => `<li>${esc(x)}</li>`).join('')}</ul>${r.moreErrors ? `<div>and ${r.moreErrors} more.</div>` : ''}</div>` : '';
    const ok = r.ok ? `<div class="kpis"><div class="kpi"><div class="v">${orgN(r.approved)}</div><div class="l">Approved</div></div><div class="kpi"><div class="v">${orgN(r.existing)}</div><div class="l">Existing</div></div><div class="kpi"><div class="v">${orgN(r.net)}</div><div class="l">Net vacant</div></div><div class="kpi"><div class="v">${orgN(r.groups)}</div><div class="l">Department and grade rows</div></div></div>
      <div class="table-wrap"><table class="org-table"><thead><tr><th>Division</th><th class="num">Approved</th><th class="num">Existing</th></tr></thead><tbody>${r.byDivision.map(x => `<tr style="cursor:default"><td>${esc(x.division)}</td><td class="num">${orgN(x.approved)}</td><td class="num">${orgN(x.existing)}</td></tr>`).join('')}</tbody></table></div>` : '';
    const warn = r.warnings && r.warnings.length ? `<div class="note">${r.warnings.map(esc).join('<br>')}</div>` : '';
    $('#orgCheck', b).innerHTML = errs + ok + warn;
  };
  $('#orgFile', b).onchange = async e => {
    const file = e.target.files[0]; rows = null; $('#orgGo', b).disabled = true;
    if (!file) return;
    fileName = file.name;
    $('#orgCheck', b).innerHTML = '<p class="hint">Reading the report…</p>';
    try {
      await loadScript(CDN_NPM + 'xlsx@0.18.5/dist/xlsx.full.min.js');
      const wb = XLSX.read(new Uint8Array(await file.arrayBuffer()), { type: 'array' });
      const grid = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: true, defval: '' });
      const hi = grid.findIndex(r => r.some(c => /^department name$/i.test(String(c).trim())) && r.some(c => /^level name$/i.test(String(c).trim())));
      if (hi < 0) { $('#orgCheck', b).innerHTML = '<div class="note warn-note">This does not look like the manpower report: no row with Department Name and Level Name was found.</div>'; return; }
      const head = grid[hi].map(c => String(c).trim());
      rows = grid.slice(hi + 1).filter(r => r.some(c => c !== '')).map(r => { const o = {}; head.forEach((h, i) => { if (h) o[h] = r[i]; }); return o; });
      const res = await api('apiOrgImport', rows, { file: fileName });
      show(res);
      $('#orgGo', b).disabled = !res.ok;
    } catch (err) { $('#orgCheck', b).innerHTML = `<div class="note warn-note">Could not read the file: ${esc(err.message || err)}</div>`; }
  };
  $('#orgGo', b).onclick = async () => {
    if (!rows) return;
    const btn = $('#orgGo', b); busy(btn, true, 'Importing…'); $('#orgCancel', b).disabled = true;
    try {
      const res = await api('apiOrgImport', rows, { apply: true, asOn: $('#orgAsOn', b).value, file: fileName });
      $('#orgCheck', b).innerHTML = `<div class="note ok-note"><b>Imported.</b> ${orgN(res.approved)} approved and ${orgN(res.existing)} existing, as on ${esc(res.asOn)}.</div>`;
      btn.hidden = true; $('#orgCancel', b).disabled = false; $('#orgCancel', b).textContent = 'Close';
      $('#orgCancel', b).onclick = () => { closeDrawer(); done(); };
    } catch (err) { toast(err, true); busy(btn, false, 'Import'); $('#orgCancel', b).disabled = false; }
  };
}

    <div class="drawer-actions" style="position:static"><button class="btn primary" id="orgMapSave">Save mapping</button></div></section>`;
  bind();
