<style>
[hidden]{display:none!important}
:root{
  --ink:#18222F; --ink-2:#4A5668; --navy:#1F3A5F; --navy-2:#2C4C75; --steel:#5B7A99;
  --paper:#F3F5F8; --card:#FFFFFF; --line:#D9DFE7; --line-2:#E9EDF2;
  --molten:#D9480F; --amber:#E0A10E; --ok:#2B8A3E; --muted:#8793A3;
  --r-sm:4px; --r-md:8px;
  --ui:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --num:'Barlow Semi Condensed','Barlow',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:15px/1.5 var(--ui);color:var(--ink);background:var(--paper)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--navy-2);outline-offset:2px}
.boot{display:grid;place-items:center;height:100vh;color:var(--ink-2)}
.boot.error{color:var(--molten);padding:24px;text-align:center}

/* Shell */
.shell{--rail-w:224px;display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);grid-template-rows:minmax(0,1fr);height:100vh}
.shell.rail-mini{--rail-w:68px}
.topbar{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:var(--navy);color:#fff}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:17px;letter-spacing:.2px}
.brand-mark{width:14px;height:14px;border-radius:50%;background:conic-gradient(#E03131 0 25%,#F2B705 0 50%,#2F9E44 0 75%,#1C7ED6 0)}
.user{font-size:14px;opacity:.9}
.user b{font-weight:600}
.rail{position:relative;z-index:6;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;min-width:0;height:100vh}
.rail-head{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:6px;height:60px;padding:0 8px 0 16px;border-bottom:1px solid var(--line-2)}
.rail-head .brand{min-width:0;overflow:hidden;white-space:nowrap;gap:10px;color:var(--navy);transition:opacity .18s,width .26s}
.rail-head .brand-mark{flex:0 0 18px;width:18px;height:18px}
.brand-text{display:flex;flex-direction:column;line-height:1.05}
.brand-text b{font-size:18px;font-weight:700;letter-spacing:.6px}
.brand-text small{font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--steel);margin-top:2px}
.rail-nav{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:2px;overflow-y:auto;overflow-x:hidden;padding:4px 10px 10px}
.rail-foot{position:relative;flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line-2);white-space:nowrap}
.avatar{flex:0 0 34px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#fff;font-size:13px;font-weight:600;letter-spacing:.3px}
.who{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.who b{font-size:14px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis}
.who span{font-size:12px;color:var(--muted)}
.rail-group{position:relative;height:30px;display:flex;align-items:flex-end;padding:0 12px 6px;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);white-space:nowrap;flex:0 0 auto}
.rail-group:first-child{height:30px}
.rail-group::before{content:"";position:absolute;left:14px;right:14px;bottom:12px;border-top:1px solid var(--line-2);opacity:0;transition:opacity .2s}
.rail a,.rail-collapse{position:relative;display:flex;align-items:center;gap:12px;min-height:40px;padding:0 12px;border-radius:10px;color:var(--ink-2);text-decoration:none;font-weight:500;white-space:nowrap;flex:0 0 auto;transition:background .15s,color .15s}
.rail .ico{flex:0 0 20px;width:20px;height:20px;display:grid;place-items:center;transition:transform .2s}
.rail .ico svg{width:20px;height:20px}
.rail .lbl{transition:opacity .18s ease,transform .22s ease;min-width:0;overflow:hidden;text-overflow:ellipsis}
.rail a:hover,.rail-collapse:hover{background:var(--paper);color:var(--ink)}
.rail a:hover .ico{transform:translateX(1px)}
.rail a[aria-current="page"]{background:#E6ECF3;color:var(--navy);font-weight:600;box-shadow:inset 3px 0 0 var(--navy)}
.rail a:focus-visible,.rail-collapse:focus-visible,.rail-toggle:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
.rail-collapse{margin-top:auto;border:0;background:transparent;font:inherit;font-size:14px;color:var(--muted);cursor:pointer;text-align:left;width:100%}
.rail-collapse .ico{transition:transform .26s cubic-bezier(.2,.8,.2,1)}
.rail-toggle{flex:0 0 34px;display:grid;place-items:center;width:34px;height:34px;border:0;border-radius:9px;background:transparent;color:var(--ink-2);cursor:pointer;transition:background .15s,color .15s}
.rail-toggle:hover{background:var(--paper);color:var(--navy)}
.rail-toggle svg{width:20px;height:20px}
.rail-toggle .tg-chev{transition:transform .26s cubic-bezier(.2,.8,.2,1);transform-origin:14px 12px}
.rail-mini .rail-toggle .tg-chev,.rail-mini .rail-collapse .ico{transform:scaleX(-1)}
.rail-mini .rail,.rail-mini .rail-nav{overflow:visible}
.rail-mini .rail-head{padding:0;gap:0;justify-content:center}
.rail-mini .rail-head .brand{width:0;opacity:0;pointer-events:none}
.rail-mini .rail-foot{padding:12px 0;justify-content:center}
.rail-mini .rail-foot .who{width:0;overflow:hidden}
.rail-mini .rail-foot::after{content:attr(data-label);position:absolute;left:calc(100% + 12px);top:50%;transform:translate(-4px,-50%);background:var(--navy);color:#fff;font-size:13px;font-weight:500;padding:6px 10px;border-radius:7px;white-space:nowrap;box-shadow:0 6px 18px rgba(24,34,47,.18);opacity:0;pointer-events:none;transition:opacity .15s,transform .15s}
.rail-mini .rail-foot:hover::after{opacity:1;transform:translate(0,-50%)}
.rail-mini .rail .lbl{opacity:0;transform:translateX(-6px);pointer-events:none}
.rail-mini .rail-group::before{opacity:1}
.rail-mini .rail a::after{content:attr(data-label);position:absolute;left:calc(100% + 12px);top:50%;transform:translate(-4px,-50%);background:var(--navy);color:#fff;font-size:13px;font-weight:500;padding:6px 10px;border-radius:7px;white-space:nowrap;box-shadow:0 6px 18px rgba(24,34,47,.18);opacity:0;pointer-events:none;transition:opacity .15s,transform .15s}
.rail-mini .rail a:hover::after,.rail-mini .rail a:focus-visible::after{opacity:1;transform:translate(0,-50%)}
.view{overflow:auto;padding:24px 28px 60px}
.view:focus{outline:none}

/* Page header */
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.page-head h1{margin:0;font-size:26px;font-weight:600;line-height:1.2}
.page-head p{margin:4px 0 0;color:var(--ink-2);max-width:62ch}

/* Buttons & fields */
.btn{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:var(--r-sm);cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--steel)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy-2)}
.btn:disabled{opacity:.55;cursor:default}
.icon-btn{border:0;background:none;font-size:18px;cursor:pointer;padding:6px 8px;color:var(--ink-2)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:13px;font-weight:500;color:var(--ink-2)}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 9px;background:#fff;width:100%}
.field textarea{min-height:84px;resize:vertical}
.field input[readonly]{background:var(--paper);color:var(--ink-2)}
.field .hint{font-size:12px;color:var(--muted)}
.grid{display:grid;gap:12px 14px;grid-template-columns:repeat(2,minmax(0,1fr))}
.grid .wide{grid-column:1/-1}
/* Forms in drawers and pop-ups use the width they have: 2 columns in a narrow drawer, 3-4 in a wide one. */
.drawer .grid,.pm-dialog.wide .grid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
/* A wide drawer lays a long form's sections side by side (newspaper columns) instead of one long stack. */
.drawer-body .form-flow{columns:2 540px;column-gap:28px}.drawer-body .form-flow>fieldset{break-inside:avoid;margin:0 0 18px}
fieldset{border:0;border-top:1px solid var(--line);margin:18px 0 0;padding:14px 0 0}
legend{font-weight:600;font-size:15px;padding:0 8px 0 0}

/* Filters */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:12px}
.filters .field{min-width:140px}
.filters .search{flex:1 1 220px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.chip-sep{width:1px;align-self:stretch;background:var(--line);margin:0 4px}
.chip-hint{font-size:13px;color:var(--muted);align-self:center;margin-left:4px}
.chip.shortcut[aria-pressed="true"]{background:var(--steel);border-color:var(--steel)}
.chip[aria-pressed="true"]:not(.shortcut)::before{content:"✓ ";font-weight:600}
.chip .n{font-family:var(--num);opacity:.75;margin-left:4px}

/* Tables */
.table-wrap{background:#fff;border:1px solid var(--line);border-radius:var(--r-md);overflow:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{position:sticky;top:0;background:#F7F9FB;text-align:left;font-weight:600;color:var(--ink-2);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th[data-k]{cursor:pointer}
th[data-k]:hover{color:var(--ink)}
td{padding:9px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover{background:#F7F9FB}
td.nw{white-space:nowrap}
td.remarks{min-width:220px;max-width:460px;white-space:normal}
td.remarks .sub{display:block}
td.num,th.num{text-align:right;font-family:var(--num);font-variant-numeric:tabular-nums}
td .sub{display:block;color:var(--muted);font-size:13px}
.empty{padding:36px;text-align:center;color:var(--ink-2)}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:10px 0;color:var(--ink-2);font-size:14px}

/* Status */
.status{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status.Open::before{background:var(--navy-2)}
.status.Offered::before{background:var(--amber)}
.status.Closed::before{background:var(--ok)}
.status.On.Hold::before,.status.Hold::before{background:var(--steel)}

/* TAT burn bar — the one signature element */
.burn{display:flex;align-items:center;gap:8px;min-width:170px}
.burn-track{position:relative;flex:1;height:8px;background:var(--line-2);border-radius:2px;overflow:visible}
.burn-fill{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--steel)}
.burn-limit{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.burn.risk .burn-fill{background:var(--amber)}
.burn.over .burn-fill{background:linear-gradient(90deg,#F08C00,var(--molten))}
.burn.done .burn-fill{background:var(--ok);opacity:.55}
.burn.missed .burn-fill{background:var(--molten);opacity:.6}
.burn-label{font-family:var(--num);font-size:13px;color:var(--ink-2);white-space:nowrap;min-width:64px;text-align:right}
.burn.over .burn-label{color:var(--molten);font-weight:600}

/* Overview */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;margin-bottom:22px}
.kpi{background:#fff;padding:14px 16px}
.kpi .v{font-family:var(--num);font-size:30px;font-weight:600;line-height:1.1}
.kpi .l{color:var(--ink-2);font-size:14px}
.kpi.alert .v{color:var(--molten)}
.two{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}.two>*{min-width:0}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r-md);padding:16px 18px}
.panel h2{margin:0 0 12px;font-size:17px;font-weight:600}
.funnel{display:flex;flex-direction:column;gap:7px}
.frow{display:grid;grid-template-columns:150px 1fr 48px;gap:10px;align-items:center;font-size:14px}
.fbar{height:18px;background:#E6ECF3;border-radius:2px;position:relative}
.fbar span{position:absolute;inset:0 auto 0 0;background:var(--navy);border-radius:2px}
.frow .num{font-family:var(--num);text-align:right}

/* Drawer */
:root{--drawer-w:min(1320px,94vw)}
body.cv-open{--drawer-w:min(640px,100vw)}
.drawer{position:fixed;top:0;right:0;height:100vh;width:var(--drawer-w);background:#fff;border-left:1px solid var(--line);box-shadow:-12px 0 32px rgba(24,34,47,.12);transform:translateX(100%);visibility:hidden;transition:transform .22s ease,visibility 0s .22s;z-index:20;display:flex;flex-direction:column}
.drawer.open{transform:none;visibility:visible;transition:transform .22s ease}
.drawer.jd-maker-drawer{width:min(1420px,calc(100vw - 240px))}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line)}
.drawer-head h2{margin:0;font-size:19px;font-weight:600}
.drawer-body{overflow:auto;padding:4px 20px 0;flex:1}
.drawer-actions{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 0 16px;margin-top:18px;display:flex;gap:10px;justify-content:flex-end}
.scrim{position:fixed;inset:0;background:rgba(24,34,47,.25);z-index:15}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:8px 0 4px}
.tabs button{border:0;background:none;padding:9px 12px;cursor:pointer;color:var(--ink-2);font-weight:500;border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--navy);border-bottom-color:var(--navy)}
.readout{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;background:var(--paper);border-radius:var(--r-sm);padding:12px}
.readout div{font-size:13px;color:var(--ink-2)}
.readout b{display:block;font-family:var(--num);font-size:18px;color:var(--ink)}
.note{background:#FFF4E6;border:1px solid #FFD8A8;border-radius:var(--r-sm);padding:10px 12px;font-size:14px;margin:12px 0}
.linklike{color:var(--navy-2);text-decoration:underline;cursor:pointer;background:none;border:0;padding:0}

/* Daily log form */
.counts{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.counts .field{display:flex;flex-direction:column;justify-content:flex-end}
.counts input{text-align:right;font-family:var(--num);font-size:17px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:var(--r-sm);opacity:0;pointer-events:none;transition:.2s;z-index:30;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast.err{background:var(--molten)}

.refresh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.refresh .stamp{font-size:13px;color:var(--ink-2)}
.cv-pane{position:fixed;top:0;left:0;bottom:0;right:var(--drawer-w);z-index:18;background:#E4E9EF;display:flex;flex-direction:column;border-right:1px solid var(--line)}
.cv-pane[hidden]{display:none}
.cv-pane-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;background:#fff;border-bottom:1px solid var(--line)}
.cv-pane-head .cv-name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.cv-pane-actions{display:flex;gap:8px;flex-shrink:0}
.cv-pane-actions a.btn{text-decoration:none;color:var(--ink)}
.cv-pane-body{flex:1;overflow:auto;padding:20px}
.cv-pane-body canvas,.cv-pane-body .cv-img{display:block;margin:0 auto 14px;box-shadow:0 1px 4px rgba(24,34,47,.18)}
.cv-pane-body .cv-doc{background:#fff;max-width:900px;margin:0 auto;max-height:none}
@media (max-width:1000px){.cv-pane{right:0;z-index:25}}
.cv-current,.cv-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px}
.cv-bar{margin-top:12px;font-size:14px;color:var(--ink-2)}
.cv-bar a.btn{text-decoration:none;color:var(--ink)}
.cv-pages canvas,.cv-img{display:block;max-width:100%;border:1px solid var(--line);margin-bottom:10px;background:#fff}
.cv-doc{border:1px solid var(--line);padding:16px;max-height:70vh;overflow:auto;font-size:14px}
.cv-flag{font-family:var(--num);font-size:12px;font-weight:600;color:var(--navy);border:1px solid var(--navy);border-radius:3px;padding:0 5px}
.ktable th.kname{min-width:240px;white-space:normal;position:sticky;left:0;background:#fff;z-index:1}
.ktable th.kname .sub{display:block;font-weight:400;font-size:13px;color:var(--muted);margin-top:2px}
.ktable thead th.kname{background:#F7F9FB;z-index:2}
.ktable tbody tr{cursor:default}
.kcell{text-align:center;cursor:pointer;min-width:74px;font-family:var(--num)}
.kcell:hover,.kcell:focus-visible{background:#EEF2F7}
.kcell b{display:block;font-size:16px}
.kcell .frac{display:block;font-size:12px;color:var(--muted)}
.empty-cell{color:var(--line);cursor:default}
.score{display:inline-block;margin-top:3px;min-width:22px;border-radius:3px;font-size:12px;font-weight:600;color:#fff;padding:0 5px}
.score.s5{background:var(--ok)}.score.s4{background:#5C940D}.score.s3{background:#B08900}.score.s2{background:#E67700}.score.s1{background:#D9480F}.score.s0{background:#C92A2A}
.ktable tr.pending th{color:var(--muted)}
.ktable tr.pending td{background:repeating-linear-gradient(45deg,#fff,#fff 6px,#F4F6F9 6px,#F4F6F9 12px)}
.legend{font-size:13px;color:var(--ink-2);margin-top:10px;max-width:90ch}
.ok{color:var(--ok);font-weight:600}.miss{color:var(--molten);font-weight:600}
.ms{border:1px solid var(--line);border-radius:var(--r-sm);padding:6px;background:#fff}
.ms-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;min-height:26px;align-items:center}
.ms-chip{display:inline-flex;align-items:center;gap:4px;background:#E6ECF3;color:var(--navy);border-radius:999px;padding:2px 4px 2px 10px;font-size:14px}
.ms-chip.legacy{background:#FFF4E6;color:#8A4B00;border:1px dashed #F0A04B}
.ms-chip button{border:0;background:none;cursor:pointer;font-size:15px;line-height:1;padding:2px 6px;color:inherit;border-radius:999px}
.ms-chip button:hover{background:rgba(0,0,0,.08)}
.ms-add{width:100%;border:1px solid var(--line-2);border-radius:var(--r-sm);padding:6px 8px;background:var(--paper)}
.pm-dialog{border:0;border-radius:var(--r-md);padding:20px 22px;width:min(520px,94vw);box-shadow:0 20px 50px rgba(24,34,47,.25)}
.pm-dialog::backdrop{background:rgba(24,34,47,.35)}
.pm-dialog h2{margin:0 0 12px;font-size:19px}
.check{background:#fff;border:1px solid var(--line);border-radius:var(--r-md);margin-bottom:10px}
.check summary{display:flex;gap:14px;align-items:center;padding:12px 16px;cursor:pointer;list-style:none}
.check summary::-webkit-details-marker{display:none}
.check[data-ok] summary{cursor:default}
.check .table-wrap{border:0;border-top:1px solid var(--line);border-radius:0}
.check summary .sub{display:block;font-size:13px;color:var(--muted);font-weight:400;margin-top:2px}
.check-n{font-family:var(--num);font-size:22px;font-weight:600;min-width:44px;text-align:right;color:var(--molten)}
.check-n.zero{color:var(--ok)}
.dfun{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:8px;align-items:end}
.dfun-step{display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px}
.dfun-bar{height:70px;width:100%;max-width:56px;background:#E6ECF3;border-radius:3px;display:flex;align-items:flex-end;overflow:hidden}
.dfun-bar span{display:block;width:100%;background:var(--navy);border-radius:3px 3px 0 0}
.dfun-step b{font-family:var(--num);font-size:18px}
.dfun-step>span{font-size:12px;color:var(--ink-2);line-height:1.2}
.day-note{width:100%;min-height:120px;border:1px solid var(--line);border-radius:var(--r-sm);padding:9px;resize:vertical}
.tasks{list-style:none;margin:0;padding:0}
.tasks li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line-2)}
.tasks li label{display:flex;gap:8px;align-items:center;cursor:pointer;flex:1}
.tasks li.done span:not(.tick){text-decoration:line-through;color:var(--muted)}
.tasks li.task-count{color:var(--ink-2);font-size:13px;border-bottom:0}
.tasks.ro li{justify-content:flex-start}
.tasks .tick{font-weight:600;color:var(--ok);width:16px}
.task-add{display:flex;gap:8px;margin-top:10px}
